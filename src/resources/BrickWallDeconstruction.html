<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrickWall Minigame</title>
  <link rel="stylesheet" href="../../resources/FontsSetUp.css">
  <link rel="stylesheet" href="../../resources/BaseStyle.css">
  <link rel="stylesheet" href="../../resources/RoundButtonsStyle.css">
  <link rel="stylesheet" href="../../resources/BrickWallBase.css">
  <link rel="stylesheet" href="../../resources/brickWallDeconstruction/BrickWallDeconstruction.css">
  <script type="text/javascript" src="../../resources/BaseJs.js" defer></script>
  <script type="text/javascript" src="../../resources/brickWallDeconstruction/BrickWallDeconstructionScore.js" defer></script>
  <script type="text/javascript" src="../../resources/BrickWallBase.js" defer></script>
  <script type="text/javascript" src="../../resources/brickWallDeconstruction/BrickWallDeconstruction.js" defer></script>
</head>
<body>


<div id="gameArea">
  <div id="bottom" class="bottom">
	[###WALL###]
    [###PILE###]
    </div>
  <div class="buttonContainer">
    <div class="roundBtn" data-tooltip="Last checkpoint">
      <button id="checkpointReturnBtn">🚩</button>
      </div>
    </div>
  <div id="scoreCounter">
    <div id="scoreDisplay">0</div>
    </div>
  <div id="screenOverlay"></div>
  <div id="loadingCircle">
    <img src="../../resources/loadingCircle.png" alt="Loading..." draggable="false">
    </div>
  <div id="gameMessage" class="messageBox" style="display: none;"></div>
  <div id="hintCharacter" class="panic" hidden>
    <img src="../../assets/panic/panic18.png" class="panicImg" draggable="false">
    <div class="speechBubble"><p></p></div>
    </div>
  <div id="levelEndCharacter" class="divFullScreenImage" hidden>
    <img src="../../resources/weDidIt.png" alt="We did it!" draggable="false">
    </div>
  <div class="movingBricks" id="movingBricks"></div>
</div>

[###CHECKPOINTS###]

</body>
</html>
