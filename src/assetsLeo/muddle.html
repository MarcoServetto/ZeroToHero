<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Muddle</title>
<style>
  /* The board is a neutral mid-grey on purpose: any tint in the surround
     drags the eye the other way and the muddy colour stops being honest. */
  :root{
    --bg:#2b2c31; --panel:#34363d; --line:#43454e; --txt:#e9eaee; --dim:#a0a4b0;
    --gold:#f3c34a; --ok:#5fbf7a;
    --pad:clamp(6px,1.5vmin,15px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
       font-size:clamp(13px,1.9vmin,17px);
       display:flex;align-items:center;justify-content:center;user-select:none}
  button{font-family:inherit;cursor:pointer}
  [hidden]{display:none !important}
  #app{width:min(100vw,100vh*1.5);height:100%;display:flex;flex-direction:column;
       padding:var(--pad);gap:var(--pad)}

  /* ---------------- heads-up strip ---------------- */
  #hud{display:flex;align-items:center;gap:.7em;flex:0 0 auto}
  #dots{display:flex;gap:.22em;flex:1 1 auto;flex-wrap:nowrap;overflow:hidden}
  .rd{height:.5em;flex:1 1 0;min-width:2px;max-width:1.1em;border-radius:99px;background:#464852}
  .rd.done{background:#6e727f}
  .rd.now{background:var(--gold)}
  .rd.sd{background:#8b5cf6}
  #clockwrap{flex:0 0 auto;width:5.5em;height:.5em;border-radius:99px;background:#464852;overflow:hidden}
  #clock{height:100%;width:100%;background:var(--ok);transition:width .3s linear,background .4s}
  #clock.low{background:#e0704f}
  #clock.next{background:var(--gold)}
  #secs{flex:0 0 auto;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums;
        font-weight:800;font-size:1.15em;color:var(--ok);transition:color .4s}
  #secs.low{color:#ff9d7d}
  #secs.next{color:var(--gold)}
  #secs .cap{font-size:.6em;opacity:.75;font-weight:600}
  #sound{background:none;border:0;color:var(--dim);font-size:1.2em;padding:0 .2em;line-height:1}

  /* ---------------- who is who ----------------
     Your own animal is the one thing on screen that must never be hunted
     for, so it is not a chip among chips: it is twice the size, ringed in
     gold, pinned to the same corner all game, and it is repeated on the
     tile you tap. Everyone else is a small chip in the crowd.            */
  #row{flex:0 0 auto;display:flex;gap:.5em;align-items:flex-start}
  #you{flex:0 0 auto;display:flex;align-items:center;gap:.3em;
       background:linear-gradient(#413a29,#37312450);border:2.5px solid var(--gold);
       border-radius:99px;padding:.1em .55em .1em .18em;box-shadow:0 0 0 .28em rgba(243,195,74,.12)}
  #you .av{font-size:2.3em;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  #you .sc{font-weight:800;font-size:1.35em;color:var(--gold);font-variant-numeric:tabular-nums;min-width:.8em;text-align:center}
  #players{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:.3em;align-content:flex-start;
           max-height:24vh;overflow:auto}
  #players.crowd{font-size:.82em}
  .chip{display:flex;align-items:center;gap:.2em;background:var(--panel);
        border:2px solid var(--line);border-radius:99px;padding:.12em .45em .12em .18em;
        position:relative;transition:transform .3s ease,border-color .3s ease,background .3s ease}
  .chip.voted{background:#3b4740;border-color:#5a7a5f}
  .chip.won{transform:translateY(-.22em);border-color:var(--gold);background:#463f2e}
  .chip .av{font-size:1.3em;line-height:1}
  .chip .sc{font-weight:700;font-size:1em;min-width:.8em;text-align:center;font-variant-numeric:tabular-nums}
  .plus{position:absolute;left:50%;top:0;transform:translateX(-50%);color:var(--gold);
        font-weight:800;pointer-events:none;animation:rise 1.4s cubic-bezier(.3,.7,.4,1) forwards}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,.2em) scale(.7)}
                  20%{opacity:1;transform:translate(-50%,-.9em) scale(1.1)}
                  100%{opacity:0;transform:translate(-50%,-2.2em) scale(1)}}

  /* ---------------- the muddy colour ---------------- */
  #stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
  #swatch{width:min(100%,44vh*1.6);height:100%;max-height:44vh;border-radius:clamp(14px,3vmin,30px);
          background:#6b6257;position:relative;overflow:hidden;
          box-shadow:0 .6em 2em rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.06);
          transition:background 1.1s ease}
  #swatch.swap{animation:swap 1.2s ease}
  @keyframes swap{0%{transform:scale(1)}18%{transform:scale(.965)}60%{transform:scale(1.008)}100%{transform:scale(1)}}
  #hand{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:2em;opacity:.55;
        animation:bob 2.8s ease-in-out infinite;pointer-events:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.42em)}}

  /* ---------------- colour tiles ---------------- */
  #tiles{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--pad);
         width:100%;max-width:min(100%,64vh);margin:0 auto}
  .tile{position:relative;aspect-ratio:1;border-radius:clamp(10px,2.4vmin,22px);border:3px solid transparent;
        background:var(--c);padding:0;overflow:visible;box-shadow:0 .25em .7em rgba(0,0,0,.3);
        transition:transform .35s cubic-bezier(.2,.9,.3,1),border-color .35s,filter .5s ease,opacity .5s ease}
  .tile:active{transform:scale(.94)}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .tile.picked{border-color:var(--gold);transform:translateY(-.35em) scale(1.05);
               box-shadow:0 .6em 1.2em rgba(0,0,0,.4)}
  .tile.dim{filter:saturate(.4) brightness(.62);opacity:.8}
  .tile.win{border-color:var(--gold);animation:winglow 2.2s ease-in-out infinite;filter:none;opacity:1}
  @keyframes winglow{0%,100%{box-shadow:0 .25em .7em rgba(0,0,0,.3),0 0 0 .1em rgba(243,195,74,.55)}
                     50%{box-shadow:0 .25em .7em rgba(0,0,0,.3),0 0 0 .45em rgba(243,195,74,.2)}}
  .tile .voters{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;
                justify-content:center;gap:.06em;font-size:clamp(11px,2.3vmin,21px);
                text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
  .tile .voters span{animation:land .5s cubic-bezier(.25,.9,.3,1.05) both}
  .tile .voters span.mine{border-radius:99px;box-shadow:0 0 0 .13em var(--gold);background:rgba(0,0,0,.18)}
  @keyframes land{from{opacity:0;transform:translateY(-.6em) scale(.7)}to{opacity:1;transform:none}}
  /* your own animal, sitting on the tile you chose */
  .tile .mypick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
                font-size:clamp(20px,5.5vmin,44px);pointer-events:none;
                filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:land .45s cubic-bezier(.25,.9,.3,1.05) both}
  .tile .crown{position:absolute;top:-.5em;left:50%;transform:translateX(-50%);
               font-size:clamp(14px,3vmin,26px);opacity:0}
  .tile.win .crown{opacity:1;animation:land .55s .12s cubic-bezier(.25,.9,.3,1.05) both}
  #tiles.locked .tile{pointer-events:none}
  /* a spent card is not a dimmed card, it is an empty place where the card was */
  .tile.spent{background:transparent;border:3px dashed var(--c);opacity:.5;pointer-events:none;
              box-shadow:none;filter:none}
  .tile.spent::after{content:"";position:absolute;inset:22%;border-radius:50%;
                     background:var(--c);opacity:.16}
  #sitrow{flex:0 0 auto;display:flex;align-items:center;gap:.5em;min-height:2.2em}
  #pass{flex:0 0 auto;display:flex;align-items:center;gap:.4em;background:#3a3d45;color:var(--txt);
        border:2px solid var(--line);border-radius:99px;padding:.25em .9em .25em .4em;font-size:1em;
        transition:transform .2s,border-color .2s,background .2s}
  #pass .who{font-size:1.5em;line-height:1}
  #pass .mark{font-size:1.1em;opacity:.8}
  #pass:active{transform:scale(.95)}
  #pass.chosen{border-color:var(--gold);background:#443d2c}
  #sat{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:.2em;font-size:1.35em;opacity:.65}
  #sat .lbl{font-size:.8em;opacity:.6;align-self:center;margin-right:.15em}

  /* ---------------- cards over the board ---------------- */
  .veil{position:fixed;inset:0;background:rgba(20,21,25,.92);z-index:30;
        display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;
        max-width:540px;width:100%}
  h1{font-size:2.2em;margin:0 0 .1em;letter-spacing:-.02em}
  h1 .a{color:var(--gold)}
  .sub{color:var(--dim);margin:0 0 1.2em;line-height:1.45}
  .lab{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:1.1em 0 .4em}
  .avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.35em}
  .avgrid button{font-size:1.6em;line-height:1;padding:.28em 0;background:#2b2d33;border:2px solid var(--line);
                 border-radius:12px;color:inherit}
  .avgrid button.on{border-color:var(--gold);background:#413a2a;transform:scale(1.06)}
  .avgrid button.taken{opacity:.2;filter:grayscale(1);cursor:default}
  .row{display:flex;gap:.5em;flex-wrap:wrap}
  .btn{flex:1 1 auto;background:#3d4048;color:var(--txt);border:1px solid var(--line);border-radius:12px;
       padding:.75em 1em;font-size:1em}
  .btn:hover{background:#474a54}
  .btn.go{background:var(--gold);border-color:var(--gold);color:#241d06;font-weight:700}
  .btn.go:hover{filter:brightness(1.08)}
  input{width:100%;background:#24262b;color:var(--txt);border:1px solid var(--line);
        border-radius:12px;padding:.7em;font-family:inherit;font-size:1em}
  .warn{color:#ffb4a2;margin:.8em 0 0}
  .ring{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;margin:1em 0;font-size:1.9em;min-height:1.6em}
  .ring .self{filter:drop-shadow(0 0 .18em var(--gold));border-bottom:.12em solid var(--gold)}
  .big{font-size:2.6em;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
  .podium{display:flex;flex-direction:column;gap:.4em;margin:1em 0}
  .prow{display:flex;align-items:center;gap:.6em;background:#2b2d33;border-radius:12px;padding:.5em .8em}
  .prow.top{background:#453d27;border:1px solid var(--gold)}
  .prow.self{outline:2px solid #6c7180}
  .prow .av{font-size:1.8em}
  .prow .bar{flex:1 1 auto;height:.55em;background:#43454e;border-radius:99px;overflow:hidden}
  .prow .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .8s ease}
  .prow .n{font-weight:800;font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
  .tiny{font-size:.82em;color:var(--dim);line-height:1.5}
  .links{font-size:.78em;color:var(--dim);margin-top:.8em;font-family:ui-monospace,Consolas,monospace}
  .links b{color:var(--ok)}
  .spin{display:inline-block;width:.85em;height:.85em;border:.14em solid var(--gold);
        border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-.08em}
  @keyframes spin{to{transform:rotate(360deg)}}
  .confetti{position:fixed;top:-8vh;font-size:1.5em;animation:fall linear forwards;pointer-events:none;z-index:31}
  @keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="dots"></div>
    <div id="clockwrap"><div id="clock"></div></div>
    <div id="secs"></div>
    <button id="sound" onclick="toggleSound()" title="Sound">&#128266;</button>
  </div>
  <div id="row">
    <div id="you"><span class="av"></span><span class="sc">0</span></div>
    <div id="players"></div>
  </div>
  <div id="stage"><div id="swatch"><div id="hand" hidden>&#11015;&#65039;</div></div></div>
  <div id="tiles"></div>
  <div id="sitrow">
    <button id="pass" onclick="pass()" hidden><span class="who"></span><span class="mark">&#9193;</span></button>
    <div id="sat"></div>
  </div>
</div>

<div class="veil" id="veil"><div class="card" id="veilCard"></div></div>

"use strict";

/* ===================================================================
   MUDDLE — a consensus game.
   There is no right answer. The colour is built to sit between two
   names, so the only way to score is to guess the crowd. One point a
   round to everyone in the biggest group; 25 rounds; a level game at
   the top plays on until somebody leads alone.
   Play is peer to peer over WebRTC. Nothing is stored anywhere.
   =================================================================== */

/* Ten rounds of the ordinary game. In the deck game a hand is eight cards, so
   a deal is eight rounds and the length is fixed by the cards, not by taste. */

   and because two children sharing an animal cannot tell which one is them. */
const AVATARS=["\u{1F98A}","\u{1F43C}","\u{1F438}","\u{1F419}","\u{1F981}","\u{1F41D}",
               "\u{1F433}","\u{1F984}","\u{1F422}","\u{1F427}","\u{1F989}","\u{1F437}",

               "\u{1F994}","\u{1F430}","\u{1F42D}","\u{1F42E}","\u{1F986}","\u{1F99C}"];

/* ============================ colour maths ============================ */
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function rgb2hex(c){ return "#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)      [r,g,b]=[c,x,0];
  else if(h<120)[r,g,b]=[x,c,0];
  else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];
  else if(h<300)[r,g,b]=[x,0,c];
  else          [r,g,b]=[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255];

  const k=v=> v>0.008856 ? Math.cbrt(v) : (7.787*v+16/116);
  x=k(x); y=k(y); z=k(z);
  return [116*y-16, 500*(x-y), 200*(y-z)];
}
function lab2rgb(L){
  const fy=(L[0]+16)/116, fx=fy+L[1]/500, fz=fy-L[2]/200;
  const g=t=>{ const t3=t*t*t; return t3>0.008856 ? t3 : (t-16/116)/7.787; };
  const x=g(fx)*0.95047, y=g(fy), z=g(fz)*1.08883;
  const s=v=>{ v = v<=0.0031308 ? 12.92*v : 1.055*Math.pow(Math.max(v,0),1/2.4)-0.055;
               return Math.max(0,Math.min(255,v*255)); };
  return [ s(x*3.2406+y*-1.5372+z*-0.4986), s(x*-0.9689+y*1.8758+z*0.0415), s(x*0.0557+y*-0.2040+z*1.0570) ];
}
/* -------------------- how a room of people names a colour --------------------
   This began as straight-line distance in CIELAB to each of the eight named
   colours, nearest wins. Lab already carries the compression eyesight applies
   — sRGB is undone through its 2.4 power curve and lightness is a cube root,
   so none of this is arithmetic on raw 0-255 numbers — but the metric was
   still wrong, because Euclidean distance treats a step in lightness as
   interchangeable with a step in hue. Naming does not work that way. Nobody
   looks at a dark maroon and says black, though black is genuinely the nearest
   point in Lab; they say red. Hue picks the name. Lightness and chroma only
   decide how sure the person is, and when the colour has drifted far enough
   off the hue circle to be called light or dark instead.

   So this returns a distribution over the eight names — how likely a room is
   to say each one — rather than a winner. Hue is scored against six centres,
   each with a reach to either side, and those reaches are deliberately
   lopsided: blue runs a long way down into cyan while green stops shortly
   after teal, which is exactly why people call cyan blue and why the boundary
   between them sits nearer green than halfway. How much of the colour hue
   speaks for at all depends on chroma, measured against a threshold that rises
   at both ends of the lightness scale, since the same faint tint reads as a
   colour in the midtones and as off-white near the top. Whatever hue does not
   claim goes to white and black, split by lightness.

   The whole game reads off this one function. The muddy colour is searched for
   with it, and the computer players guess with it.                          */
const HUE=[[36,34,15],[66,15,15],[97,15,20],[144,20,30],[287,65,13],[313,13,30]];
const clamp01=v=> v<0?0 : v>1?1 : v;

function nameScores(rgb){
  const lab=rgb2lab(rgb), L=lab[0], C=Math.hypot(lab[1],lab[2]);
  const h=(Math.atan2(lab[2],lab[1])*180/Math.PI+360)%360;
  // how much chroma it takes to read as a colour here rather than as a tint
  const K=14+26*Math.pow(Math.max(0,(L-78)/22),2)+22*Math.pow(Math.max(0,(20-L)/20),2);
  const cN=Math.pow(C,1.6), kN=Math.pow(K,1.6);
  const g=cN/(cN+kN);                                   // the share hue speaks for
  const w=HUE.map(function(c){
    const d=((h-c[0]+540)%360)-180;
    const reach = d<0 ? c[1] : c[2];
    return Math.exp(-0.5*(d/reach)*(d/reach));
  });
  const tot=w.reduce((a,b)=>a+b,0)||1;
  const wl=clamp01((L-30)/48);                          // where it sits on the grey axis
  return w.map(v=>g*v/tot).concat([(1-g)*wl,(1-g)*(1-wl)]);
}

/* -------------------- picking a deliberately muddy colour --------------------
   Muddy does not mean brown, it means undecidable. The search walks perceptual
   space directly — a lightness, a chroma and a hue angle, converted back and
   dropped if it lands outside what a screen can show — and keeps the colour
   whose two likeliest names come closest to equally likely, with the other six
   nowhere. Nothing is hand-listed any more: whichever arguments the naming
   model says are real ones are the arguments the game finds, teal caught
   between blue and green included.

   `target` is how level the two claims must be, and it tightens every round.
   Round one splits about 55/30 and most of the room lands together; round
   twenty-five is 49/48 and the room tears in half.                        */
let lastNamePair="";
function candidate(){
  for(let k=0;k<40;k++){
    const L=20+Math.random()*72, C=3+Math.random()*72, rad=Math.random()*Math.PI*2;
    const rgb=lab2rgb([L, C*Math.cos(rad), C*Math.sin(rad)]);
    if(rgb.every(v=>v>=-0.6&&v<=255.6)) return rgb;     // inside the screen's gamut
  }
  return null;
}
function makeColor(round, span){
  const target=Math.min(0.97, 0.55+0.42*round/(span||TOTAL));
  let best=null, repeat=null;
  for(let i=0;i<900;i++){
    const rgb=candidate(); if(!rgb) continue;
    const p=nameScores(rgb);
    const o=p.map((v,j)=>[v,j]).sort((a,b)=>b[0]-a[0]);
    if(o[0][0]+o[1][0]<0.72) continue;                  // the two must own the colour
    if(o[2][0]>0.42*o[1][0]) continue;                  // and it stays a two-horse race
    const cand={err:Math.abs(o[1][0]/o[0][0]-target), rgb:rgb,
                k:[o[0][1],o[1][1]].sort().join("-")};
    if(cand.k===lastNamePair){ if(!repeat||cand.err<repeat.err) repeat=cand; }
    else if(!best||cand.err<best.err) best=cand;        // prefer a different argument
  }
  const pick=best||repeat;
  if(!pick) return "#6b6257";
  lastNamePair=pick.k;
  return rgb2hex(pick.rgb);
}

/* ============================== sound ============================== */
let audioOn=true, ac=null;
function toggleSound(){ audioOn=!audioOn; document.getElementById("sound").textContent=audioOn?"\u{1F50A}":"\u{1F507}"; }
function beep(freq,dur,type,vol){
  if(!audioOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol||0.12,ac.currentTime+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.02);
  }catch(e){}
}

const sTick =()=>beep(430,0.07,"triangle",0.05);

/* ============================== state ============================== */
const UID = "p"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
let me={ id:UID, av:AVATARS[Math.floor(Math.random()*AVATARS.length)], since:Date.now() };
let mode="menu";            // menu | practice | online
let myVote=null, seenRound=-1, hold=false;
let V=null;                 // the one shape the screen draws
let H=null, bots=[];        // host state, and the practice room

function newHost(seed){
  H={ round:0, phase:"lobby", endsAt:0, color:"#6b6257",
      votes:{}, scores:seed||{}, result:null, sudden:false, deck:false, hands:{} };
}
/* ------------------------------ the deck game ------------------------------
   Eight colours, so eight cards, each spendable once. A deal is eight rounds,
   which means every card you decline to spend is a card you will never spend:
   hoarding is not free. Sitting a round out scores nothing but keeps the card,
   and that is the whole point — once the colour the room is going to settle on
   is one you have already spent, playing anything else both scores nothing and
   burns a card, so passing strictly beats playing. That is a real decision,
   and it is the first one in this game that is not about eyesight.        */
const FULLHAND=255;                                  // eight bits, one per colour
const holds=(mask,i)=> ((mask>>i)&1)===1;
function dealHands(ps){ for(const p of ps) H.hands[p.id]=FULLHAND; }
const spanOf = ()=> (H&&H.deck) ? DECK_ROUNDS : TOTAL;
const myHand = ()=>{
  if(!V||!V.deck) return FULLHAND;
  const h=(V.hands||[]).find(x=>x[0]===UID);
  return h?h[1]:FULLHAND;
};
function livePlayers(){
  if(mode==="practice") return [me].concat(bots);
  const now=Date.now(), out=[me];
  for(const [id,e] of roster) if(id!==UID && now-e.at<GONE) out.push({id, av:e.av, since:e.since||0});
  out.sort((a,b)=>a.id<b.id?-1:1);
  return out;
}
/* ---------------------------- who runs the room ----------------------------
   The room belongs to whoever got here first: that is the teacher, and it is
   the one player who can never need to inherit a game from anybody.

   Two rules keep every screen at the same answer. The office is sticky — a
   host who is still present and still answering stays the host, whatever
   anyone's clock says — and it is only re-elected when the chair is actually
   empty, which is the moment the old host's heartbeat stops. A page that has
   just opened is not eligible at all until it has listened for a couple of
   seconds, and it says so in its own heartbeat rather than deciding it
   privately, because a player everyone else has already elected but who
   privately refuses the job leaves the room with no clock at all. That is
   worse than either outcome and it is exactly what happened when a laptop
   with a slow clock walked into a game in progress.                       */
let settleAt=0;
const settling = ()=> mode==="online" && Date.now()<settleAt;
const isReady = id => id===UID ? !settling() : !!(roster.get(id)||{}).rdy;
/* Someone I have never heard a heartbeat from ranks last, not first. Defaulting
   an unknown arrival to zero made a stranger outrank the sitting host. */
function arrival(id){
  if(id===UID) return me.since;
  const e=roster.get(id);
  return e ? (e.since||0) : Infinity;
}
function beats(a,b){ const x=arrival(a), y=arrival(b); return x!==y ? x<y : a<b; }
/* Does an incoming host outrank me? Whoever has the game further along wins,
   because that is the state the room would lose; between two hosts equally far
   along, the one who has been here longer keeps the office. */
function hostWins(m){
  const mine = (!H || H.phase==="lobby") ? -1 : H.round;
  const theirs = (m.phase==="lobby") ? -1 : m.round;
  return theirs!==mine ? theirs>mine : beats(m.f,UID);
}
function hostId(){
  if(mode==="practice") return UID;
  const ps=livePlayers(), live=new Set(ps.map(p=>p.id));
  /* An incumbent only has to be alive. Readiness is deliberately not asked
     about here: it is a fact that travels by heartbeat and so arrives at
     different screens a moment apart, and hanging the succession on it made
     two machines swap the office back and forth several times a second. */
  if(V && V.host && live.has(V.host)) return V.host;
  let best=null;
  for(const p of ps) if(isReady(p.id) && (!best||beats(p.id,best))) best=p.id;
  return best;          // nobody eligible yet: the chair stays empty rather than
}                       // every page in a new room appointing itself at once
const iAmHost = ()=> mode==="practice" || (mode==="online" && hostId()===UID);

/* ============================== the host clock ==============================
   Exactly one machine runs the clock: in practice mode this one, online the
   player with the lowest id, recomputed every beat. Everything the host knows
   travels in one message, so if the host closes their laptop the next player
   picks the clock up from the last view they were sent, with nothing to
   negotiate.                                                               */
function hostStep(){
  if(!H || !iAmHost()) return;
  const now=Date.now(), ps=livePlayers();
  for(const p of ps) if(H.scores[p.id]==null) H.scores[p.id]=0;

  /* Taking the clock over from a host who left. Their last view is the whole
     handover — round, colour, scores — and the votes they had collected are
     gone, so the round is simply asked again. Keyed off the view being further
     along than mine rather than off my own phase, because my phase may be
     anything at all at the moment I inherit. */
  if(V && V.host!==UID && V.phase!=="lobby" &&
     (V.round>H.round || (V.round===H.round && H.phase==="lobby"))){
    H.round=V.round; H.color=V.color; H.sudden=!!V.sudden;
    H.scores=scoresFromView(V); H.votes={};
    H.phase="vote"; H.endsAt=now+VOTE_MS;
  }
  /* Left on your own — everyone else closed a lid, or this tab lost the room
     for a moment — the game waits rather than resets. Wiping back to the lobby
     here used to throw away a game in progress during the second or two it
     takes a dropped host to be noticed, and, worse, publish that empty lobby
     to everyone still playing. */
  if(ps.length<2 && H.phase!=="lobby"){
    if(H.phase==="vote") H.endsAt=now+VOTE_MS;
    else if(H.endsAt<now) H.endsAt=now+REVEAL_MS;
    publish(); return;
  }

  if(H.phase==="lobby"){
    /* Three players and a five second countdown is the default, but whoever
       got here first is running the room and can hold it open for a class
       still arriving, or start early with two. */
    if(ps.length>=MINP && !hold){
      if(!H.endsAt) H.endsAt=now+(mode==="practice"?1400:LOBBY_MS);
      else if(now>=H.endsAt) hostStart(ps);
    } else H.endsAt=0;
  }
  else if(H.phase==="vote"){
    const waiting=ps.filter(p=>H.votes[p.id]==null).length;
    if(!waiting || now>=H.endsAt) hostScore(ps);
  }
  else if(H.phase==="reveal"){ if(now>=H.endsAt) hostNext(ps); }
  else if(H.phase==="over"){ if(now>=H.endsAt){ H.phase="lobby"; H.endsAt=0; H.scores={}; H.round=0; } }
  publish();
}
function hostStart(ps){
  H.scores={}; for(const p of ps) H.scores[p.id]=0;
  H.deck=wantDeck; H.hands={}; dealHands(ps);
  H.round=0; H.sudden=false; hold=false; hostRound();
}
function hostRound(){
  H.round++; H.phase="vote"; H.votes={}; H.result=null;
  const ps=livePlayers();
  for(const p of ps) if(H.hands[p.id]==null) H.hands[p.id]=FULLHAND;   // a late arrival gets a full hand
  if(H.deck && (H.round-1)%DECK_ROUNDS===0) dealHands(ps);             // a fresh deal
  H.color=makeColor(H.round, spanOf()); H.endsAt=Date.now()+VOTE_MS;
  if(mode==="practice") botsThink(H.round);
}
function hostScore(ps){
  const counts=new Array(8).fill(0);
  for(const p of ps){ const v=H.votes[p.id]; if(v!=null && v>=0) counts[v]++; }
  const max=Math.max.apply(null,counts);
  const winners = max>0 ? counts.map((c,i)=>c===max?i:-1).filter(i=>i>=0) : [];
  const got=[];
  /* Two groups of the same size both win. It is the generous reading, it keeps
     a split room from being a round where nobody scores, and in the deck game
     it softens the sting of having spent the card. */
  for(const p of ps){
    const v=H.votes[p.id];
    if(v!=null && v>=0 && winners.indexOf(v)>=0){ H.scores[p.id]=(H.scores[p.id]||0)+1; got.push(p.id); }
  }
  H.result={counts,winners,got};
  H.phase="reveal"; H.endsAt=Date.now()+REVEAL_MS;
}
function hostNext(ps){
  if(H.round>=spanOf()){
    let top=-1,n=0;
    for(const p of ps){ const s=H.scores[p.id]||0; if(s>top){top=s;n=1;} else if(s===top) n++; }
    if(n===1){ H.phase="over"; H.endsAt=Date.now()+OVER_MS; publish(); return; }
    H.sudden=true;                                    // level at the top: play on
  }
  hostRound();
}
function hostVote(id, round, idx){
  if(!H || H.phase!=="vote" || round!==H.round) return;
  if(idx!==-1 && !(idx>=0&&idx<8)) return;                 // -1 is sitting the round out
  if(H.votes[id]!=null) return;
  if(idx>=0 && H.deck){
    const hand=H.hands[id]==null?FULLHAND:H.hands[id];
    if(!holds(hand,idx)) return;                           // that card is already spent
    H.hands[id]=hand & ~(1<<idx);
  }
  H.votes[id]=idx; publish();
}
function hostView(){
  const ps=livePlayers();
  return { host:UID, round:H.round, phase:H.phase, left:Math.max(0,H.endsAt-Date.now()),
    color:H.color, sudden:H.sudden, deck:!!H.deck, total:spanOf(),
    hands: H.deck ? ps.map(p=>[p.id, H.hands[p.id]==null?FULLHAND:H.hands[p.id]]) : null,
    players:ps.map(p=>[p.id,p.av,H.scores[p.id]||0, H.votes[p.id]!=null?1:0]),
    votes: H.phase==="reveal" ? Object.keys(H.votes).map(k=>[k,H.votes[k]]) : null,
    winners: H.phase==="reveal"&&H.result ? H.result.winners : null,
    got: H.phase==="reveal"&&H.result ? H.result.got : null };
}
let sentKey="", sentAt=0;
function publish(){
  if(!iAmHost()) return;
  const v=hostView();
  adopt(v);
  if(mode!=="online") return;
  /* the clock ticks four times a second; the room only needs to hear about it
     when something changed, or often enough to catch a late joiner up */
  const key=JSON.stringify([v.round,v.phase,v.color,v.players,v.winners,v.hands]), now=Date.now();
  if(key!==sentKey || now-sentAt>900){ sentKey=key; sentAt=now; netSend("gm",v); }
}
function scoresFromView(v){ const s={}; for(const p of (v.players||[])) s[p[0]]=p[2]; return s; }

function adopt(v){
  const wasRound=V?V.round:-1, wasPhase=V?V.phase:"";
  v.endsAt=Date.now()+(v.left||0);
  V=v;
  if(v.round!==wasRound) myVote=null;
  if(v.phase!==wasPhase||v.round!==wasRound){
    if(v.phase==="vote") sStart();
    else if(v.phase==="reveal") (v.got&&v.got.indexOf(UID)>=0) ? sWin() : sLose();
  }
  render();
}

/* ============================== drawing ==============================
   Renders are cheap but not free, and more to the point a rebuild in the
   middle of a CSS transition is what makes a screen flicker rather than
   move. So the board only redraws when something it shows has actually
   changed, and the parts that tick every frame — the clock bar, the lobby
   countdown — are written straight into their own element.              */
function buildTiles(){
  document.getElementById("tiles").innerHTML = COLORS.map((c,i)=>
    '<button class="tile" style="--c:'+c+'" onclick="pick('+i+')" aria-label="colour '+(i+1)+'">'+
    '<span class="crown">\u2B50</span><span class="voters"></span></button>').join("");
}
const chipEls=new Map();
function renderPeople(){
  const list=(V&&V.players)||[];
  const mine=list.find(p=>p[0]===UID);
  const you=document.getElementById("you");
  you.querySelector(".av").textContent=me.av;
  you.querySelector(".sc").textContent=mine?mine[2]:0;

  const wrap=document.getElementById("players"), keep=new Set();
  for(const [id,av,score,voted] of list){
    if(id===UID) continue;                       // you are the badge, not a chip

      el.innerHTML='<span class="av"></span><span class="sc"></span>';

  }

function bump(el){

}
function renderDots(){
  const el=document.getElementById("dots");

  }

let lastKey="";
function render(force){
  if(!V) return;
  const key=[V.phase,V.round,V.color,myVote,JSON.stringify(V.players),
             JSON.stringify(V.winners),JSON.stringify(V.votes),JSON.stringify(V.hands)].join("|");
  if(!force && key===lastKey) return;
  lastKey=key;

  renderDots(); renderPeople();

  const sw=document.getElementById("swatch");
  if(V.round!==seenRound){

  }

  document.getElementById("hand").hidden = !(V.phase==="vote" && myVote==null && V.round<=2);

  const tiles=document.getElementById("tiles");
  tiles.classList.toggle("locked", V.phase!=="vote"||myVote!=null);
  const pile=[[],[],[],[],[],[],[],[]];
  const satOut=[];

                                                                        // right now is not "gone" yet
    const cls="tile"+(picked?" picked":"")+(win?" win":"")+(spent?" spent":"")+
              (((V.phase==="vote"&&myVote!=null&&myVote!==i)||(V.phase==="reveal"&&!win))?" dim":"");
    if(t.className!==cls) t.className=cls;

    if(v.dataset.k!==want){

  pb.disabled = myVote!=null;
  const satKey=satOut.join("");
  if(sat.dataset.k!==satKey){
    sat.dataset.k=satKey;
    sat.innerHTML = satOut.length
      ? '<span class="lbl">\u23ED</span>'+satOut.map(a=>"<span>"+a+"</span>").join("")
      : "";
  }
  tickClock();
}
/* Both waits are shown, because both were invisible before: how long you have
   left to choose, and how long the room stays on the answer before the next
   colour. The seconds are also spoken as a tick in the last five, since a
   child looking at the colour is not looking at the clock. */
let lastTick=-1;
function tickClock(){
  const bar=document.getElementById("clock"), wrap=document.getElementById("clockwrap"),
        secs=document.getElementById("secs");
  const running = V && (V.phase==="vote"||V.phase==="reveal");
  if(!running){ wrap.style.opacity=.15; bar.style.width="100%"; bar.className=""; secs.textContent=""; return; }
  const reveal=V.phase==="reveal", span=reveal?REVEAL_MS:VOTE_MS;
  const left=Math.max(0,V.endsAt-Date.now()), s=Math.ceil(left/1000);
  wrap.style.opacity=1;
  bar.style.width=Math.max(0,Math.min(100,left/span*100))+"%";
  bar.className = reveal ? "next" : (left<10000?"low":"");
  secs.className = reveal ? "next" : (left<10000?"low":"");
  secs.textContent = s;
  if(!reveal && myVote==null && s<=5 && s>0 && s!==lastTick){ lastTick=s; sTick(); }
  if(reveal || s>5) lastTick=-1;
}

/* ============================== picking ============================== */
function startNow(){
  if(!iAmHost()||!H||H.phase!=="lobby") return;
  const ps=livePlayers();
  if(ps.length<2) return;
  hold=false; hostStart(ps); publish(); drawVeil();
}
function holdRoom(v){ hold=!!v; if(iAmHost()&&H) H.endsAt=0; drawVeil(); }
function choose(i){
  if(!V||V.phase!=="vote"||myVote!=null) return;
  if(i>=0 && V.deck && !holds(myHand(),i)) return;         // that card is gone
  myVote=i; if(i>=0) sPick(); else beep(330,0.12,"triangle",0.09);
  if(iAmHost()) hostVote(UID,V.round,i); else netSend("vt",{r:V.round,c:i});
  render();
}
/* declarations rather than consts: these are named by inline handlers in the
   markup, and a function declaration is the shape that is unambiguously there */
function pick(i){ choose(i); }
function pass(){ choose(-1); }

/* ============================== the cards ============================== */
let setupTab="online", roomName="", botCount=5, veilKey="", wantDeck=false;
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function drawVeil(){
  const veil=document.getElementById("veil"), card=document.getElementById("veilCard");
  const show = mode==="menu" || (V&&(V.phase==="lobby"||V.phase==="over"));
  veil.hidden=!show;
  if(!show){ veilKey=""; return; }
  const ps=(V&&V.players)||[];
  const key=[mode,setupTab,botCount,link.err,peerCount(),hold,iAmHost(),wantDeck,
             V?V.phase:"",V?V.round:"",me.av,takenKey(),JSON.stringify(ps)].join("|");
  if(key!==veilKey){
    veilKey=key;
    card.innerHTML = mode==="menu" ? menuHTML() : (V&&V.phase==="over") ? overHTML() : lobbyHTML();
    if(V&&V.phase==="over") confetti();
  }
  const c=document.getElementById("count");                 // ticks on its own, no rebuild
  if(c&&V){
    const secs=V.endsAt?Math.max(0,Math.ceil((V.endsAt-Date.now())/1000)):null;
    c.textContent = (V.phase==="lobby"&&secs!=null&&V.left) ? secs : ps.length+" / "+MINP;
  }
}
/* Who has which animal. An animal already spoken for cannot be picked, and if
   two players land on the same one anyway — they chose at the same moment, or
   arrived from different corners of a room that had not met yet — the one who
   joined later quietly moves to a free animal rather than both of them
   spending the game unsure which is theirs. */
function takenAvatars(){
  const m=new Map();
  if(mode==="practice"){ for(const b of bots) m.set(b.av,{id:b.id, since:0}); }
  else { const now=Date.now();
         for(const [id,e] of roster) if(now-e.at<GONE) m.set(e.av,{id, since:e.since||0}); }
  return m;
}
/* Who has the better claim on an animal: whoever has been in the room longer.
   Clocks between two laptops never agree exactly, so the id settles a tie and
   keeps both sides at the same answer. Arrival order rather than id order
   matters because it means nobody already playing ever has their animal taken
   out from under them by somebody who just walked in. */
function outranks(a,b){ return a.since!==b.since ? a.since<b.since : a.id<b.id; }
const takenKey = ()=>[...takenAvatars().keys()].join("");
function resolveAvatar(){
  if(mode!=="online") return;
  const t=takenAvatars(), holder=t.get(me.av);
  if(holder && outranks(holder,{id:UID,since:me.since})){
    const free=AVATARS.find(a=>!t.has(a));
    if(free){ me.av=free; sendHello(false); if(iAmHost()&&H) publish(); render(true); drawVeil(); }
  }
}
function avPicker(){
  const t=takenAvatars();
  return '<div class="avgrid">'+AVATARS.map(a=>{
    const taken=t.has(a)&&t.get(a).id!==UID;
    return '<button class="'+(me.av===a?"on":"")+(taken?" taken":"")+'"'+
           (taken?' disabled':' onclick="setAv(\''+a+'\')"')+'>'+a+'</button>';
  }).join("")+'</div>';
}
function setDeck(v){ wantDeck=!!v; drawVeil(); }
function setAv(a){ me.av=a; drawVeil(); if(mode==="online") sendHello(false); if(iAmHost()&&H) publish(); render(true); }

function menuHTML(){
  return '<h1>Mudd<span class="a">le</span></h1>'+
    '<p class="sub">A muddy colour appears. Everyone taps the colour they think it is closest to. '+
    'You score only if you land in the biggest group &mdash; so tap what the room will tap, not what you see. '+
    'If two groups tie for biggest, both score. Best with 5 to 15 players, and no reading needed once it starts.</p>'+
    '<div class="lab">Pick your animal &mdash; this is how you find yourself on screen</div>'+avPicker()+
    '<div class="lab">Game</div>'+
    '<div class="row">'+
      '<button class="btn'+(!wantDeck?" go":"")+'" onclick="setDeck(false)">Ten rounds</button>'+
      '<button class="btn'+(wantDeck?" go":"")+'" onclick="setDeck(true)">Every colour once</button>'+
    '</div>'+
    '<p class="tiny" style="margin-top:.5em">'+(wantDeck
      ? 'Eight cards, one of each colour, each played once. A deal is eight rounds, so a card you keep is a card you lose &mdash; and when the colour the room will settle on is one you have spent, sitting the round out beats burning another card.'
      : 'Ten rounds. Every colour stays available every round.')+'</p>'+
    '<div class="row" style="margin-top:1.2em">'+
      '<button class="btn'+(setupTab==="online"?" go":"")+'" onclick="setupTab=\'online\';drawVeil()">Play with friends</button>'+
      '<button class="btn'+(setupTab==="practice"?" go":"")+'" onclick="setupTab=\'practice\';drawVeil()">Practice alone</button>'+
    '</div>'+
    (setupTab==="online"
      ? '<div class="lab">Room name &mdash; everyone types the same one</div>'+
        '<input id="room" value="'+esc(roomName)+'" placeholder="for instance  ms-lee-class-4" '+
        'onkeydown="if(event.key===\'Enter\')joinRoom(this.value)">'+
        '<div class="row" style="margin-top:.7em"><button class="btn go" onclick="joinRoom(document.getElementById(\'room\').value)">Join room</button></div>'+
        '<p class="tiny" style="margin-top:.9em">Everyone opens this same file and types the same room name. '+
        'Play runs browser to browser and nothing is stored anywhere, so every player needs to be online '+
        'at the same time.</p>'+
        (link.err?'<p class="warn">'+esc(link.err)+'</p>':'')
      : '<div class="lab">Computer players</div>'+
        '<input type="range" min="2" max="11" value="'+botCount+'" '+
        'oninput="botCount=+this.value;document.getElementById(\'bc\').textContent=this.value">'+
        '<div class="big" id="bc">'+botCount+'</div>'+
        '<div class="row"><button class="btn go" onclick="startPractice()">Start practice game</button></div>'+
        '<p class="tiny" style="margin-top:.9em">The computer players guess the way a room of people tends to, '+
        'which is a good way to show a child how it works before the real thing.</p>');
}
function hostAv(ps){ const h=ps.find(p=>p[0]===(V&&V.host)); return h?h[1]:"\u2753"; }
function lobbyHTML(){
  const ps=(V&&V.players)||[];
  const need=Math.max(0,MINP-ps.length);
  const waited=Math.round((Date.now()-link.since)/1000);
  return '<h1>Mudd<span class="a">le</span></h1>'+
    '<p class="sub">'+(mode==="online"?'Room <b>'+esc(roomName)+'</b>. ':'')+
      (need? '<span class="spin"></span> Waiting for '+need+' more player'+(need>1?'s':'')+'.' : 'Starting\u2026')+'</p>'+
    '<div class="ring">'+ps.map(p=>'<span class="'+(p[0]===UID?"self":"")+'">'+p[1]+'</span>').join("")+'</div>'+
    '<div class="big" id="count">'+ps.length+' / '+MINP+'</div>'+
    (mode==="online"
      ? '<div class="links">'+link.rooms.map(r=>r.key+": "+(r.peers?"<b>linked</b>":"searching\u2026")).join("<br>")+'</div>'+
        (need&&waited>25 ? '<p class="tiny" style="margin-top:.8em">Still nobody. Check that the others typed '+
          'the room name exactly the same way, that they are online now, and that they are not on a network '+
          'that blocks peer-to-peer traffic &mdash; some school and office wifi does. A phone hotspot is a good test.</p>' : '')+
        (iAmHost()
          ? '<div class="row" style="margin-top:.9em">'+
            '<button class="btn go"'+(ps.length<2?' disabled':'')+' onclick="startNow()">Start now</button>'+
            '<button class="btn'+(hold?' go':'')+'" onclick="holdRoom('+(hold?'false':'true')+')">'+
            (hold?'Holding &mdash; tap to release':'Wait for more')+'</button></div>'+
            '<div class="row" style="margin-top:.5em">'+
            '<button class="btn'+(!wantDeck?" go":"")+'" onclick="setDeck(false)">Ten rounds</button>'+
            '<button class="btn'+(wantDeck?" go":"")+'" onclick="setDeck(true)">Every colour once</button></div>'+
            '<p class="tiny" style="margin-top:.6em">You arrived first, so this room is yours to run. '+
            (hold?'It is held open until you start it.'
                 :'It starts on its own five seconds after the third player joins.')+'</p>'
          : '<p class="tiny" style="margin-top:.9em">'+hostAv(ps)+' got here first and will start the game.</p>')
      : '')+
    '<div class="lab">Your animal</div>'+avPicker()+
    '<div class="row" style="margin-top:1em"><button class="btn" onclick="quit()">Leave</button></div>';
}
function overHTML(){
  const ps=((V&&V.players)||[]).slice().sort((a,b)=>b[2]-a[2]);
  const top=ps.length?ps[0][2]:0;
  return '<div class="big" style="font-size:3.4em">'+(ps.length?ps[0][1]:"")+'</div>'+
    '<h1 style="text-align:center;font-size:1.4em">Winner</h1>'+
    '<div class="podium">'+ps.map((p,i)=>
      '<div class="prow'+(i===0?" top":"")+(p[0]===UID?" self":"")+'"><span class="av">'+p[1]+'</span>'+
      '<span class="bar"><i style="width:'+(top?Math.round(p[2]/top*100):0)+'%"></i></span>'+
      '<span class="n">'+p[2]+'</span></div>').join("")+'</div>'+
    '<p class="tiny">A new game starts here in a moment. Everyone keeps their seat.</p>'+
    '<div class="row" style="margin-top:.8em"><button class="btn" onclick="quit()">Leave</button></div>';
}
let confettiRound=-1;
function confetti(){
  if(!V||confettiRound===V.round) return;
  confettiRound=V.round;
  for(let i=0;i<22;i++){
    const d=document.createElement("div");
    d.className="confetti"; d.textContent=["\u2B50","\u{1F386}","\u{1F31F}"][i%3];
    d.style.left=Math.random()*100+"vw";
    d.style.animationDuration=(2.4+Math.random()*2)+"s";
    d.style.animationDelay=(Math.random()*1.4)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),6500);
  }
}

/* ============================== computer players ============================== */
/* Not colour matchers: guessers at what a room of people will say. Each has
   its own eye and its own small bias, which is what makes a practice game feel
   like a real one — the room mostly agrees, and sometimes splits in two.   */
function makeBots(n){
  const pool=AVATARS.filter(a=>a!==me.av).sort(()=>Math.random()-0.5);
  const out=[];
  for(let i=0;i<n;i++)
    out.push({ id:"bot"+i, av:pool[i%pool.length], bot:true,
               temp:0.45+Math.random()*1.05,             // decisive, or easily swayed
               bias:Math.floor(Math.random()*8), pull:Math.random()*0.5 });
  return out;
}
function botHand(id){
  if(!H||!H.deck) return FULLHAND;
  return H.hands[id]==null?FULLHAND:H.hands[id];
}
function botPick(bot,color){
  /* Sampling the naming distribution, not measuring a distance. A cool-headed
     player says whatever the room is likeliest to say; a waverer picks between
     the top two, which is what makes a close colour split a practice room the
     way it splits a real one. */
  const p=nameScores(hex2rgb(color));
  const hand=botHand(bot.id);
  let w=p.map((v,i)=>Math.pow(v,1/bot.temp)*(i===bot.bias?1+bot.pull:1));
  if(H&&H.deck){
    /* With a hand, a computer player weighs whether the round is winnable at
       all: if the colours the room is likely to settle on are ones it has
       already spent, it keeps its cards rather than burning one for nothing. */
    let live=0;
    for(let i=0;i<8;i++){ if(!holds(hand,i)) w[i]=0; else live+=p[i]; }
    if(live<0.28 && Math.random()<0.75) return -1;
    if(w.every(v=>v===0)) return -1;
  }
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<8;i++){ r-=w[i]; if(r<=0) return i; }
  return H&&H.deck ? -1 : 7;
}
function botsThink(round){
  for(const b of bots){
    setTimeout(()=>{
      if(mode!=="practice"||!H||H.round!==round||H.phase!=="vote") return;
      hostVote(b.id, round, botPick(b,H.color)); sTick();
    }, 900+Math.random()*7000);
  }
}

/* ============================== online ==============================
   Trystero pairs browsers over WebRTC. Three lessons are baked in here.

   The library is bundled into this file rather than fetched from a CDN,
   because a page opened straight from the disk cannot import a module over
   the network — which is exactly how most people will open this.

   Two rendezvous strategies run at once, nostr relays and torrent trackers.
   They use completely different infrastructure, so a network that blocks one
   usually still passes the other, and a peer found by either is a peer.

   Identity is a uid this page made up, carried inside every message, not the
   transport's peer id. So the same player found twice over two strategies is
   one player, and none of the game logic cares which pipe anything arrived
   through.                                                               */
const APPID="muddle-colour-consensus-7c31";
const link={ rooms:[], err:"", since:0 };
let roster=new Map(), claims=new Map(), beatTimer=null;
const peerCount=()=>link.rooms.reduce((n,r)=>n+r.peers,0);

/* Trystero has shipped two shapes for these over the years and a page in the
   wild may meet either: an action can be a [send, onMessage] tuple or an
   object whose onMessage is a settable property, and the peer callbacks can be
   functions you call or properties you assign. Guessing wrong here fails
   silently — the handler is simply never registered — so both are handled. */
function actionPair(room,name){
  const a=room.makeAction(name);
  if(Array.isArray(a)) return {send:a[0], on:a[1]};
  return {send:d=>a.send(d), on:f=>{ a.onMessage=f; }};
}
function onPeerEvent(room,key,fn){
  try{ const cur=room[key]; if(typeof cur==="function"){ cur(fn); return; } }catch(e){}
  try{ room[key]=fn; }catch(e){}
}
function joinRoom(raw){
  const name=String(raw==null?"":raw).trim();
  if(name.length<2){ link.err="Give the room a name of at least two characters."; drawVeil(); return; }
  const TR=window.TRYSTERO;
  if(!TR||!TR.strategies){ link.err="The peer-to-peer library did not load. Try re-downloading the file."; drawVeil(); return; }

  roomName=name; link.err=""; link.since=Date.now(); link.rooms=[];
  mode="online"; roster=new Map(); claims=new Map(); hold=false;
  me.since=Date.now(); settleAt=me.since+2500;
  const roomId="mdl-"+name.toLowerCase().replace(/\s+/g,"-").slice(0,40);

  for(const key of Object.keys(TR.strategies)){
    let room;
    try{ room=TR.strategies[key]({appId:APPID}, roomId); }
    catch(e){ continue; }                                   // one strategy short is not fatal
    const entry={key, room, peers:0, act:{}};
    for(const k of ["hi","vt","gm"]){
      const p=actionPair(room,k);
      entry.act[k]=p.send;
      p.on(m=>onNet(k,m));
    }
    onPeerEvent(room,"onPeerJoin",()=>{ entry.peers++; sendHello(false); drawVeil(); });
    onPeerEvent(room,"onPeerLeave",()=>{ entry.peers=Math.max(0,entry.peers-1); drawVeil(); });
    link.rooms.push(entry);
  }
  if(!link.rooms.length){ mode="menu"; link.err="No way to reach the other players from this browser."; drawVeil(); return; }

  newHost();
  V={host:null, round:0, phase:"lobby", left:0, endsAt:0, color:"#6b6257",
     players:[[UID,me.av,0,0]], votes:null, winners:null, got:null};
  sendHello(false);
  beatTimer=setInterval(beat,HB);
  render(true); drawVeil();
}
function netSend(kind,payload){
  const msg=Object.assign({f:UID},payload);
  for(const r of link.rooms){ try{ r.act[kind](msg); }catch(e){} }
}
function sendHello(re){ if(mode==="online") netSend("hi",{av:me.av, t:me.since, rdy:!settling(), re:!!re}); }
function onNet(kind,m){
  if(!m||!m.f||m.f===UID||mode!=="online") return;
  if(kind==="hi"){
    const was=roster.get(m.f);
    roster.set(m.f,{av:m.av||"\u2753", since:m.t||0, rdy:!!m.rdy, at:Date.now(),
                    first:(was&&was.first)||Date.now()});
    if(!m.re) sendHello(true);
    resolveAvatar();
    if(!was) drawVeil();
    if(iAmHost()&&H) publish();
    return;
  }
  if(kind==="vt"){ if(iAmHost()) hostVote(m.f,m.r,m.c); return; }
  if(kind==="gm"){
    /* Only a host sends these, and it signs them, so this is the room telling
       me who is actually running it. Believe it unless somebody better is
       broadcasting too.

       Deciding instead from my own idea of who *ought* to be host was the bug
       behind the worst symptom this game has had: a player whose guess differed
       from the room's threw away every message from the real host, so it never
       learned better, and sat alone in an empty lobby for the whole game while
       everyone else played. A rule that filters out the evidence that would
       correct it can never correct itself. */
    if(m.host===m.f) claims.set(m.f, Date.now());
    if(iAmHost()){
      // two hosts: the live game beats the empty one, and only then does
      // seniority decide. Yielding on seniority alone let a survivor who had
      // just sat down in an empty lobby overrule the one holding the game.
      if(m.host===m.f && hostWins(m)) adopt(m);
      return;
    }
    const now=Date.now();
    for(const [id,at] of claims)
      if(id!==m.f && now-at<3500 && beats(id,m.f)) return;   // a better host is live
    adopt(m); drawVeil();
    if(m.phase==="vote"&&myVote!=null){         // a dropped vote packet: say it again
      const mine=(m.players||[]).find(p=>p[0]===UID);
      if(mine&&!mine[3]) netSend("vt",{r:m.round,c:myVote});
    }
  }
}
function beat(){
  if(mode!=="online") return;
  const now=Date.now();
  for(const [id,e] of roster) if(now-e.at>=GONE) roster.delete(id);
  sendHello(false);
  resolveAvatar();
  if(iAmHost()&&!H) newHost(V?scoresFromView(V):null);
  drawVeil();
}

/* ============================== running ============================== */
function startPractice(){ mode="practice"; bots=makeBots(botCount); newHost(); publish(); drawVeil(); }
function quit(){
  if(beatTimer){ clearInterval(beatTimer); beatTimer=null; }
  for(const r of link.rooms){ try{ r.room.leave(); }catch(e){} }
  link.rooms=[]; link.err=""; roster=new Map(); claims=new Map();
  bots=[]; H=null; V=null; myVote=null; seenRound=-1; lastKey=""; hold=false;
  for(const [,el] of chipEls) el.remove();
  chipEls.clear();
  mode="menu"; drawVeil();
}
setInterval(()=>{ hostStep(); tickClock(); drawVeil(); }, 250);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sendHello(false); });

buildTiles();
document.getElementById("you").querySelector(".av").textContent=me.av;
drawVeil();
</script>
</body>
