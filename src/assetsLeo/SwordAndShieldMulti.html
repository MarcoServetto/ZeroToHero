/* ================================= AI ================================= */
const HEADCELL = [[1,1],[8,8]];
let AI = [false,false];
let aiRunning = false, aiPaused = false, aiCalling = false;
let aiViz = null, aiSeen = 0, aiPaintAt = 0;
const PACE = { calm:{move:780, pass:260, rx:1050, think:1100, tries:12},
               brisk:{move:360, pass:120, rx:500,  think:380,  tries:12} };
let pace = "calm";
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const gd = (p,h)=> Math.abs(p.r-h[0]) + Math.abs(p.c-h[1]);

function simClone(ps){ return ps.map(p=>({id:p.id,owner:p.owner,sides:p.sides,loc:p.loc,r:p.r,c:p.c,acted:p.acted})); }

/* ---------- how much a piece is worth (from long experience) ---------- */
const CODE = s => s[0]*27 + s[1]*9 + s[2]*3 + s[3];
const VAL = new Float64Array(81), NSW = new Int8Array(81), NSH = new Int8Array(81);
(function(){
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)for(let c=0;c<3;c++)for(let d=0;d<3;d++){
    const t=[a,b,c,d], i=CODE(t);
    const s1=t.filter(x=>x===SWORD).length, s2=t.filter(x=>x===SHIELD).length;
    let v = 4 + 1.3*s2 + 1.0*s1;
    if((s2===3&&s1===1)||(s2===2&&s1===2)) v += 1.6;   // the strongest shapes
    if(s1===4) v -= 2.0;                               // four swords: a liability
    VAL[i]=v; NSW[i]=s1; NSH[i]=s2;
  }
})();
function pieceValue(p){ return VAL[CODE(p.sides)]; }

/* occupancy without allocating: a stamped typed array, reused every call */
const OCC = new Int32Array(100), OCCAT = new Int32Array(100);
let occStamp = 0;
function fillOcc(ps){
  occStamp++;
  for(const p of ps) if(p.loc==="board"){ const i=p.r*10+p.c; OCC[i]=p.id; OCCAT[i]=occStamp; }
}
function occAt(r,c){
  if(r<0||r>9||c<0||c>9) return -1;
  const i=r*10+c;
  return OCCAT[i]===occStamp ? OCC[i] : -1;
}

/* ---------- position evaluation, from `me`'s point of view ---------- */
function evalState(ps, me){
  let v = 0, onBoard = 0;
  for(const p of ps) if(p.loc==="board") onBoard++;
  for(const p of ps){
    if(p.loc!=="board") continue;
    const own = p.owner, foe = 1-own, s = (own===me ? 1 : -1);
    const s1 = p.sides.filter(x=>x===SWORD).length, s2 = p.sides.filter(x=>x===SHIELD).length;
    const dFoe = gd(p,HEADCELL[foe]), dOwn = gd(p,HEADCELL[own]);
    v += s*pieceValue(p);
    v += s*0.45*(16-dFoe);                                       // press forward
    if(p.r===CREATE[foe][0] && p.c===CREATE[foe][1])             // tapping the enemy forge
      v += s*(7 + (s2>=3 ? 3 : 0));
    if(p.r===CREATE[own][0] && p.c===CREATE[own][1])             // squatting on your own forge stops production
      v -= s*2.8;
    if(dFoe<=2) v += s*3.5;                                      // pressure on the crown
    if(s1===4) v += s*(dOwn<=4 ? -4 : (dFoe<=5 ? 2 : 0));        // keep the four-sword far from home
    if(gd(p,CREATE[own])<=2 && onBoard<14) v += s*0.5;           // a reserve by the forge
    for(let d=0;d<4;d++) if(p.sides[d]===SWORD){
      const n = {r:p.r+DIRS[d][0], c:p.c+DIRS[d][1]};
      if(gd(n,HEADCELL[own]) < dOwn) v += s*0.45;                // swords aimed home = bounce fuel
    }
  }
  return v;
}

/* ---------- simulation ---------- */
function legalActions(ps, who, phase){
  const out = [];
  if(phase==="create"){
    const [cr,cc] = CREATE[who];
    if(!occMap(ps).has(key(cr,cc)))
      for(const p of ps) if(p.owner===who && p.loc==="ready")
        for(const k of distinctRots(p.sides)) out.push({kind:"create", id:p.id, k});
    out.push({kind:"skip"});
  } else {
    for(const p of ps) if(p.loc==="board" && p.owner===who && !p.acted){
      for(let d=0;d<4;d++) out.push({kind:"move", id:p.id, d});
      for(const k of distinctRots(p.sides))    // a turn that changes nothing is the pass below
        if(k!==0) out.push({kind:"rot", id:p.id, k});
      out.push({kind:"pass", id:p.id});
    }
  }
  return out;
}
function simAction(ps, a){
  if(a.kind==="move"){ const p=ps[a.id]; p.acted=true; pushChain(ps,p.r,p.c,a.d); }
  else if(a.kind==="rot"){ const p=ps[a.id]; p.sides=rotSides(p.sides,a.k); p.acted=true; }
  else if(a.kind==="pass"){ ps[a.id].acted = true; }
  else if(a.kind==="create"){ const p=ps[a.id]; p.sides=rotSides(p.sides,a.k);
                              p.loc="board"; p.r=CREATE[p.owner][0]; p.c=CREATE[p.owner][1]; }
}
function rxPref(r, me, ps){
  if(r.type==="kill") return ps[r.victim].owner===me ? -10 : 10;
  if(r.type==="both") return (ps[r.ids[0]].owner===me?-6:6) + (ps[r.ids[1]].owner===me?-6:6);
  return 0;
}
// resolve a chain the way `me` would schedule it -> "win" | "loss" | "ok" | "loop"
function simResolve(ps, me){
  if(RESOLVE_STRONG) return simResolveStrong(ps, me);
  for(let i=0;i<70;i++){
    const rx = computeReactions(ps);
    if(!rx.length) return "ok";
    if(rx.some(r=>r.type==="head" && r.owner!==me)) return "win";
    const others = rx.filter(r=>r.type!=="head");
    if(!others.length) return "loss";
    others.sort((a,b)=> rxPref(b,me,ps)-rxPref(a,me,ps));
    applyReaction(ps, others[0]);
  }
  return "loop";
}
function chooseRxIndex(rx, me){
  if(AI[me]==="medium" || AI[me]==="hard"){
    const w = rx.findIndex(r=>r.type==="head" && r.owner!==me);
    if(w>=0) return w;
    const others = rx.filter(r=>r.type!=="head");
    if(others.length) return rx.indexOf(others[bestRxIndex(state.pieces, others, me)]);
  }
  let bi = 0, bs = -1e9;
  rx.forEach((r,i)=>{
    let s;
    if(r.type==="head") s = (r.owner!==me) ? 1e6 : -1e6;
    else s = rxPref(r, me, state.pieces);
    if(s>bs){ bs=s; bi=i; }
  });
  return bi;
}

/* ---------- (1) is there a win right now?  (2) can the enemy win right now? ---------- */
function findWin(ps, me, phase){
  for(const a of legalActions(ps, me, phase)){
    const c = simClone(ps); simAction(c,a);
    aiSeen++;
    if(simResolve(c,me)==="win") return a;
  }
  return null;
}
function enemyWinReply(ps, opp){
  const acts = legalActions(ps,opp,"create").filter(a=>a.kind==="create")
               .concat(legalActions(ps,opp,"move"));
  for(const a of acts){
    const c = simClone(ps); simAction(c,a);
    aiSeen++;
    if(simResolve(c,opp)==="win") return a;
  }
  return null;
}

/* ---------- choosing a decent-but-mostly-random action ---------- */
async function chooseAction(ps, me, phase){
  const acts = legalActions(ps, me, phase), scored = [];
  for(const a of acts){
    const c = simClone(ps); simAction(c,a);
    const res = simResolve(c,me);
    aiSeen++;
    if(res==="loop") continue;                       // illegal: the chain never ends
    let sc = res==="win" ? 1e6 : res==="loss" ? -1e6 : evalState(c,me);
    if(a.kind==="rot")  sc -= 1.4;                   // rotation is rarely the move
    if(a.kind==="pass") sc -= 1.2;
    if(a.kind==="skip") sc -= 0.4;
    sc += Math.random()*0.9;
    scored.push({a,sc});
    if((aiSeen & 63)===0){ aiMark(ps,a); await aiPaint(); }
  }
  if(!scored.length) return null;
  scored.sort((x,y)=>y.sc-x.sc);
  aiMark(ps, scored[0].a, true); await aiPaint(true);
  const top = scored.slice(0, Math.min(5,scored.length));
  const w = [5,4,3,2,1].slice(0,top.length), tot = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot;
  for(let i=0;i<top.length;i++){ r -= w[i]; if(r<=0) return top[i].a; }
  return top[0].a;
}

/* ---------- plan a whole turn, retrying until it is not suicidal ---------- */
async function planTurn(me){
  const tries = PACE[pace].tries, t0 = Date.now();
  let best = null;
  for(let attempt=0; attempt<tries; attempt++){
    aiViz.attempt = attempt+1; aiViz.tries = tries;
    const ps = simClone(state.pieces), plan = [];
    let createDone = state.createDone, decided = false;
    if(!createDone){
      const w = findWin(ps, me, "create");
      if(w){ plan.push(w); simAction(ps,w); if(simResolve(ps,me)==="win") decided = true; }
      else {
        const a = await chooseAction(ps, me, "create");
        if(a){ plan.push(a); simAction(ps,a); simResolve(ps,me); }
      }
    }
    if(!decided) for(let step=0; step<26; step++){
      if(!legalActions(ps,me,"move").length) break;
      const w = findWin(ps, me, "move");
      if(w){ plan.push(w); simAction(ps,w); simResolve(ps,me); decided = true; break; }
      const a = await chooseAction(ps, me, "move");
      if(!a) break;
      plan.push(a); simAction(ps,a);
      if(simResolve(ps,me)==="loss") break;
      await aiPaint();
    }
    if(decided) return {plan, winning:true};
    const threat = enemyWinReply(ps, 1-me);
    const score = evalState(ps,me) - (threat ? 10000 : 0);
    if(!best || score>best.score) best = {plan, score, safe:!threat};
    aiViz.safe = !threat;
    await aiPaint(true);
    if(!threat && attempt>=1) break;                 // safe enough, stop searching
    if(Date.now()-t0 > 4000) break;                  // hard time budget
  }
  return {plan:best.plan, safe:best.safe};
}

/* ---------- showing the thinking ---------- */
function aiMark(ps, a, isBest){
  if(!a || a.kind==="skip") return;
  let m = null;
  if(a.kind==="create"){ const [r,c]=CREATE[state.turn]; const [x,y]=cellXY(r,c); m={x1:x,y1:y,x2:x,y2:y,spin:true}; }
  else {
    const p = ps[a.id]; if(!p || p.loc!=="board") return;
    const [x,y] = cellXY(p.r,p.c);
    if(a.kind==="move"){ const [tx,ty]=cellXY(p.r+DIRS[a.d][0], p.c+DIRS[a.d][1]); m={x1:x,y1:y,x2:tx,y2:ty}; }
    else m = {x1:x,y1:y,x2:x,y2:y,spin:true};
  }
  if(isBest) aiViz.best = m;
  else { aiViz.marks.push(m); if(aiViz.marks.length>16) aiViz.marks.shift(); }
}
async function aiPaint(force){
  const now = Date.now();
  if(!force && now-aiPaintAt < 60) return;
  aiPaintAt = now;
  const acc = ACC[state.turn];
  let s = "";
  aiViz.marks.forEach((m,i)=>{
    const o = (0.10 + 0.45*(i+1)/aiViz.marks.length).toFixed(2);
    s += m.spin
      ? '<circle cx="'+m.x1+'" cy="'+m.y1+'" r="20" fill="none" stroke="'+acc+'" stroke-opacity="'+o+'" stroke-width="2" stroke-dasharray="4 4"/>'
      : '<line x1="'+m.x1+'" y1="'+m.y1+'" x2="'+m.x2+'" y2="'+m.y2+'" stroke="'+acc+'" stroke-opacity="'+o+'" stroke-width="3" stroke-linecap="round"/>';
  });
  if(aiViz.best){
    const b = aiViz.best;
    s += '<line x1="'+b.x1+'" y1="'+b.y1+'" x2="'+b.x2+'" y2="'+b.y2+'" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>'+
         '<circle cx="'+b.x2+'" cy="'+b.y2+'" r="8" fill="'+acc+'" opacity=".9"/>';
  }
  document.getElementById("fx").innerHTML = s;
  await sleep(0);
}

/* ---------- running a turn ---------- */
async function aiTurn(){
  if(aiRunning || state.gameOver || !AI[state.turn]) return;
  aiRunning = true; aiPaused = false; aiSeen = 0;
  aiViz = {marks:[], best:null, attempt:1, tries:PACE[pace].tries, safe:null, phase:''};
  render();
  const me = state.turn;
  await sleep(180);
  const t0 = Date.now();
  let res;
  try {
    res = AI[me]==="hard"   ? await planStrong(me, LVL.hard)
        : AI[me]==="medium" ? await planStrong(me, LVL.medium)
        : await planTurn(me);
  }
  catch(err){ console.error(err); res = {plan:[]}; }
  const wait = PACE[pace].think - (Date.now()-t0);
  if(wait>0) await sleep(wait);
  document.getElementById("fx").innerHTML = "";
  aiViz = null;
  for(const a of (res.plan||[])){
    if(state.gameOver || state.turn!==me) break;
    if(a.kind==="rx"){                       // the search chose this schedule; replay it exactly
      await sleep(PACE[pace].rx);
      aiCalling = true; rxClick(a.i); aiCalling = false;
      continue;
    }
    await sleep(a.kind==="pass"||a.kind==="skip" ? PACE[pace].pass : PACE[pace].move);
    aiCalling = true;
    if(a.kind==="create")      createPiece(a.id, a.k);
    else if(a.kind==="skip")   skipCreation();
    else if(a.kind==="move")   movePiece(a.id, a.d);
    else if(a.kind==="rot")    rotatePiece(a.id, a.k);
    else if(a.kind==="pass")   rotatePiece(a.id, 0);
    aiCalling = false;
  }
  let guard = 0;                             // anything left over: resolve it greedily
  while(!state.gameOver && state.turn===me && computeReactions(state.pieces).length && guard++<90){
    await sleep(PACE[pace].rx);
    aiCalling = true; rxClick(chooseRxIndex(computeReactions(state.pieces), me)); aiCalling = false;
  }
  aiRunning = false;
  if(!state.gameOver && state.turn===me){ await sleep(PACE[pace].move); aiCalling = true; endTurnBtn(); aiCalling = false; }
  else render();
}
function aiMaybeStart(){
  if(state.gameOver || aiRunning || aiPaused) return;
  if(AI[state.turn]) setTimeout(()=>{ aiTurn(); }, 260);
}
function aiResume(){ aiPaused = false; render(); aiMaybeStart(); }

/* ============================ MEDIUM BRAIN ============================
   Easy weighs single actions. Medium searches whole turns: sequences of
   actions inside one turn, and scores the position it would hand over by
   looking at every reply. Roughly 10-30x the compute of Easy.          */

function relevantActions(ps, me, radius){
  const fh = HEADCELL[1-me], out = [];
  for(const p of ps) if(p.loc==="board" && p.owner===me && !p.acted && gd(p,fh)<=radius){
    for(let d=0;d<4;d++) out.push({kind:"move", id:p.id, d});
    for(let k=1;k<4;k++) out.push({kind:"rot", id:p.id, k});
  }
  return out;
}
function winActions(ps, me, depth){
  return depth<=1 ? legalActions(ps,me,"move") : relevantActions(ps,me,depth+2);
}
// synchronous inner search: is there a sequence of `depth` more actions that wins?
function winDFS(ps, me, depth, st){
  for(const a of winActions(ps,me,depth)){
    if(++st.n > st.budget || st.n > st.cap) return null;
    const c = simClone(ps); simAction(c,a);
    const res = simResolve(c,me);
    if(res==="win") return [a];
    if(res!=="ok") continue;
    if(depth>1){ const sub = winDFS(c, me, depth-1, st); if(sub) return [a].concat(sub); }
  }
  return null;
}
// iterative deepening over the whole turn, yielding to the browser as it goes
async function winSearchTurn(ps, me, maxDepth, budget, viz, minDepth){
  const st = {n:0, budget, cap:Infinity};
  for(let d=minDepth||1; d<=maxDepth; d++){
    const acts = winActions(ps, me, d);
    for(let i=0;i<acts.length;i++){
      if(++st.n > st.budget) return null;
      const c = simClone(ps); simAction(c,acts[i]);
      const res = simResolve(c,me);
      if(res==="win") return [acts[i]];
      if(res==="ok" && d>1){
        st.cap = st.n + 12000;                       // keep any one branch short enough to stay responsive
        const sub = winDFS(c, me, d-1, st);
        if(sub) return [acts[i]].concat(sub);
      }
      if(viz && (i%4)===0){
        aiViz.phase = "hunting for a forced win — "+d+" action"+(d>1?"s":"")+" deep";
        aiSeen = st.n; aiMark(ps, acts[i]); await aiPaint();
      }
    }
  }
  return null;
}

/* ---- how many ways would I have to win if the position came back to me ---- */
function countWins(ps, me){
  const base = simClone(ps);
  for(const p of base) if(p.owner===me) p.acted = false;
  const pieces = new Set(); let n = 0;
  for(const a of legalActions(base, me, "move")){
    const c = simClone(base); simAction(c,a);
    if(simResolve(c,me)==="win"){ n++; pieces.add(a.id); }
  }
  return {n, distinct:pieces.size};
}
/* ---- one pass over every enemy reply: do they win, and what can they take ---- */
function analyzeReplies(ps, opp, me){
  const acts = legalActions(ps,opp,"create").filter(a=>a.kind==="create")
               .concat(legalActions(ps,opp,"move"));
  let bestCap = 0;
  for(const a of acts){
    const c = simClone(ps); simAction(c,a);
    const res = simResolve(c,opp);
    if(res==="win") return {win:true, bestCap:0};
    if(res!=="ok") continue;
    let cap = 0;
    for(const p of ps){
      if(p.loc!=="board" || c[p.id].loc!=="dead") continue;
      cap += (p.owner===me ? pieceValue(p) : -0.8*pieceValue(p));
    }
    if(cap>bestCap) bestCap = cap;
  }
  return {win:false, bestCap};
}

/* ---- Medium's positional sense: Easy's, plus the things that actually decide games ---- */
function evalStateM(ps, me){
  let v = evalState(ps, me);
  for(const p of ps){
    if(p.loc!=="board") continue;
    const own = p.owner, foe = 1-own, s = (own===me ? 1 : -1);
    if(gd(p,HEADCELL[foe])===1) v += s*9;        // standing on the crown's doorstep
    if(gd(p,HEADCELL[own])===1){                 // holding your own doorstep denies it to them
      v += s*3.5;
      const toward = DIRS.findIndex((d,i)=> p.r+d[0]===HEADCELL[own][0] && p.c+d[1]===HEADCELL[own][1]);
      const out = (toward+2)%4;
      if(p.sides[out]===SHIELD) v += s*2;        // shield facing outward: a wall
    }
  }
  return v;
}

async function chooseActionM(ps, me, phase){
  const acts = legalActions(ps, me, phase), scored = [];
  for(const a of acts){
    const c = simClone(ps); simAction(c,a);
    const res = simResolve(c,me);
    aiSeen++;
    if(res==="loop") continue;
    let sc = res==="win" ? 1e6 : res==="loss" ? -1e6 : evalStateM(c,me);
    if(a.kind==="rot")  sc -= 1.4;
    if(a.kind==="pass") sc -= 1.2;
    if(a.kind==="skip") sc -= 0.4;
    sc += Math.random()*0.5;
    scored.push({a,sc});
    if((aiSeen & 255)===0){ aiMark(ps,a); await aiPaint(); }
  }
  if(!scored.length) return null;
  scored.sort((x,y)=>y.sc-x.sc);
  const top = scored.slice(0, Math.min(3,scored.length));
  const w = [4,2,1].slice(0,top.length), tot = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot;
  for(let i=0;i<top.length;i++){ r -= w[i]; if(r<=0) return top[i].a; }
  return top[0].a;
}

async function buildPlanM(me){
  const ps = simClone(state.pieces), plan = [];
  if(!state.createDone){
    const a = await chooseActionM(ps, me, "create");
    if(a){ plan.push(a); simAction(ps,a); simResolve(ps,me); }
  }
  for(let step=0; step<26; step++){
    if(!legalActions(ps,me,"move").length) break;
    const w = findWin(ps, me, "move");
    if(w){ plan.push(w); simAction(ps,w); simResolve(ps,me); break; }
    const a = await chooseActionM(ps, me, "move");
    if(!a) break;
    plan.push(a); simAction(ps,a);
    if(simResolve(ps,me)==="loss") break;
  }
  return {ps, plan};
}

/* ---- what is this finished turn actually worth, once they get to answer ---- */
async function deepScore(ps, me){
  const opp = 1-me;
  const rep = analyzeReplies(ps, opp, me);
  if(rep.win) return -1e6;
  const combo = await winSearchTurn(ps, opp, 2, 90000, false, 2);   // a two-action kill for them
  if(combo) return -5e5 + evalStateM(ps,me);
  let s = evalStateM(ps, me);
  const mine = countWins(ps, me);
  s += Math.min(mine.n,4)*6 + (mine.distinct>=2 ? 12 : 0);          // unanswerable double threats
  s -= rep.bestCap*0.9;                                             // what they can take from me
  return s;
}

async function planTurnMedium(me){
  const t0 = Date.now();
  aiViz.phase = "hunting for a forced win";
  let pre = [];
  if(!state.createDone){
    const w = findWin(state.pieces, me, "create");
    if(w) return {plan:[w], winning:true};
    pre = [{kind:"skip"}];
  }
  const seq = await winSearchTurn(state.pieces, me, 3, 350000, true);
  if(seq) return {plan: pre.concat(seq), winning:true};

  const N = 18; let best = null;
  for(let i=0;i<N;i++){
    aiViz.attempt = i+1; aiViz.tries = N; aiViz.phase = "weighing whole turns";
    const {ps, plan} = await buildPlanM(me);
    aiViz.phase = "checking every reply you could make";
    const sc = await deepScore(ps, me);
    if(!best || sc>best.sc) best = {plan, sc};
    aiViz.safe = best.sc > -4e5;
    await aiPaint(true);
    if(best.sc > -4e5 && i>=5) break;
    if(Date.now()-t0 > 7000) break;
  }
  return {plan:best.plan, safe:best.sc > -4e5};
}

/* ======================= STRONG BRAIN (medium & hard) =======================
   Easy scores single actions against a pile of hand-written positional rules.
   This one hands the work to search. It enumerates genuinely different ways to
   open the turn, completes each one greedily, then plays the opponent's answer
   out against every candidate — and, for the best few, its own answer to that
   answer. Three half-turns deep. Almost all of Easy's positional terms are
   gone; what is left is material, pressure concentrated on the two doorstep
   squares beside each crown, and forge control.                            */

const LVL = {
  medium:{ states:26000,  searchMs:8000,  width:600,  rxBranch:3, consider:16, minScored:8,
           foeStates:5000,   foeMs:4000, foeWidth:400,  ms:3500 },
  hard:  { states:90000,  searchMs:25000, width:2000, rxBranch:3, consider:44, minScored:14,
           foeStates:14000,  foeMs:9000, foeWidth:1200, counter:true, ms:11000 }
};
let RESOLVE_STRONG = false;      // only one AI turn runs at a time, so a flag is enough

/* ---- reaction scheduling: take the reaction that leaves the best position ---- */
function bestRxIndex(ps, rx, me){
  let bi = -1, bs = -Infinity;
  rx.forEach((r,i)=>{
    let s;
    if(r.type==="head") s = (r.owner!==me) ? 1e9 : -1e9;
    else { const c = simClone(ps); applyReaction(c,r); s = evalStrong(c,me); }
    if(s>bs){ bs=s; bi=i; }
  });
  return bi;
}
function simResolveStrong(ps, me){
  for(let i=0;i<70;i++){
    const rx = computeReactions(ps);
    if(!rx.length) return "ok";
    if(rx.some(r=>r.type==="head" && r.owner!==me)) return "win";
    const others = rx.filter(r=>r.type!=="head");
    if(!others.length) return "loss";
    applyReaction(ps, others[bestRxIndex(ps, others, me)]);
  }
  return "loop";
}

function freshFor(ps, who){ const c = simClone(ps); for(const p of c) if(p.owner===who) p.acted=false; return c; }

/* ---- greedy completion of a turn ---- */
function greedyAction(ps, who, phase, noise){
  let best = null, bs = -Infinity;
  for(const a of legalActions(ps, who, phase)){
    const c = simClone(ps); simAction(c,a);
    const res = simResolveStrong(c, who);
    aiSeen++;
    if(res==="loop") continue;
    let sc = res==="win" ? 1e6 : res==="loss" ? -1e6 : evalStrong(c, who);
    if(a.kind==="rot")  sc -= 0.8;
    if(a.kind==="pass") sc -= 1.6;   // idling wasted six turns in a recorded game
    if(a.kind==="skip") sc -= 0.3;
    if(noise) sc += Math.random()*noise;
    if(sc>bs){ bs=sc; best=a; }
  }
  return best;
}
function buildTurnFrom(ps0, who, first, noise){
  const ps = simClone(ps0), plan = [];
  if(first){
    plan.push(first); simAction(ps, first);
    if(simResolveStrong(ps,who)==="win") return {ps, plan, won:true};
  }
  for(let i=0;i<26;i++){
    if(!legalActions(ps, who, "move").length) break;
    const w = findWin(ps, who, "move");
    if(w){ plan.push(w); simAction(ps,w); simResolveStrong(ps,who); return {ps, plan, won:true}; }
    const a = greedyAction(ps, who, "move", noise);
    if(!a) break;
    plan.push(a); simAction(ps,a);
    if(simResolveStrong(ps,who)==="loss") break;
  }
  return {ps, plan, won:false};
}
// a whole turn for `who` from scratch, creation included
function buildTurn(ps0, who, noise){
  const ps = simClone(ps0), plan = [];
  const a = greedyAction(ps, who, "create", noise);
  if(a){ plan.push(a); simAction(ps,a); if(simResolveStrong(ps,who)==="win") return {ps,plan,won:true}; }
  const rest = buildTurnFrom(ps, who, null, noise);
  return {ps:rest.ps, plan:plan.concat(rest.plan), won:rest.won};
}

/* ---- what a finished turn is worth once the opponent has answered it ---- */
function threatBonus(ps, me){
  const t = countWins(ps, me);
  return Math.min(t.n,4)*4 + (t.distinct>=2 ? 11 : 0);        // a double threat cannot be parried
}
async function scoreTurn(ps, me, cfg, deep){
  const opp = 1-me;
  const rep = analyzeReplies(ps, opp, me);
  if(rep.win) return -1e6;
  const combo = await winSearchTurn(ps, opp, deep?cfg.s2Depth:cfg.oppDepth,
                                              deep?cfg.s2Budget:cfg.oppBudget, false, 2);
  if(combo) return -5e5;
  const n = deep ? cfg.s2Replies : cfg.replies;
  let worst = Infinity;
  for(let i=0;i<n;i++){
    const r = buildTurn(freshFor(ps,opp), opp, i===0 ? 0 : 1.0);   // they actually play a turn
    if(r.won) return -4e5;
    let v;
    if(deep && cfg.ply3){
      const mine = buildTurn(freshFor(r.ps,me), me, 0);             // and I answer that
      v = mine.won ? 6e4 : evalStrong(mine.ps, me) + threatBonus(mine.ps, me);
    } else {
      v = evalStrong(r.ps, me) + threatBonus(r.ps, me);
    }
    if(v<worst) worst = v;
  }
  return worst;
}

/* ================== EXHAUSTIVE TURN SEARCH (medium & hard) ==================
   A turn is: an optional creation, then each piece acts at most once, plus a
   scheduling choice wherever several reactions are pending. Enumerated as
   sequences that is millions of lines; but wildly different sequences land on
   the same board, so we walk it breadth-first and hash every position reached,
   which collapses it to a DAG of tens of thousands. Measured on a real 5-piece
   turn: 3.9M sequences -> 23,679 distinct positions, fully enumerable.
   Only ~0.4% of actions leave more than one reaction pending, so branching on
   the schedule as well is nearly free.
   Every node is a legal end of turn, because leaving pieces unmoved is legal. */

function hashTurnState(ps, me){
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(const p of ps){
    const v = p.loc==="board" ? (p.r*10+p.c+1) : (p.loc==="dead" ? 101 : 102);
    const s = p.sides[0]*27 + p.sides[1]*9 + p.sides[2]*3 + p.sides[3];
    const a = (p.owner===me && p.acted) ? 1 : 0;
    h1 = (Math.imul(h1 ^ (v + s*211 + a*40009 + p.id*7919), 16777619)) >>> 0;
    h2 = (h2 + Math.imul(v*31 + s + a*7 + p.id, 2654435761)) >>> 0;
  }
  return h1.toString(36)+":"+h2.toString(36);
}

/* resolve a chain, branching wherever the schedule is a real choice.
   returns {win:true} or a list of {ps, rx:[indices chosen]}            */
function resolveBranch(ps0, me, cap){
  const out = [];
  const stack = [{ps:ps0, rx:[]}];
  let guard = 0;
  while(stack.length && out.length<cap && guard++ < 400){
    const cur = stack.pop();
    const rx = computeReactions(cur.ps);
    if(!rx.length){ out.push(cur); continue; }
    if(rx.some(r=>r.type==="head" && r.owner!==me)) return {win:true};
    const others = [];
    rx.forEach((r,i)=>{ if(r.type!=="head") others.push({r,i}); });
    if(!others.length) continue;                       // only our own crown left: dead line
    if(others.length===1){
      applyReaction(cur.ps, others[0].r);
      stack.push({ps:cur.ps, rx:cur.rx.concat([others[0].i])});
      continue;
    }
    others.sort((a,b)=> rxPref(b.r,me,cur.ps) - rxPref(a.r,me,cur.ps));
    for(const o of others.slice(0,3)){
      const c = simClone(cur.ps);
      applyReaction(c, o.r);
      stack.push({ps:c, rx:cur.rx.concat([o.i])});
    }
  }
  return {states:out};
}

/* ---- evaluation ------------------------------------------------------
   The board has exactly four cells that matter: two crowns and two forges.
   Everything below is pressure on those four cells, plus material. Swords
   press crowns, shields hold forges; one decay curve per kind of pressure.  */
const FWD  = [[2,1],[0,3]];                       // the way each side advances
const sharp = d => 14/(1 + 0.34*d*d);             // crown pressure: sharply local
const soft  = (d,reach) => d>=reach ? 0 : (reach-d)/reach;   // forge pressure: linear reach

/* friendly pieces within three steps — the diamond around a square */
function nearbyFriends(ps, p){
  let n = 0;
  for(let dr=-3; dr<=3; dr++){
    const rem = 3-(dr<0?-dr:dr);
    for(let dc=-rem; dc<=rem; dc++){
      if(dr===0 && dc===0) continue;
      const id = occAt(p.r+dr, p.c+dc);
      if(id>=0 && ps[id].owner===p.owner) n++;
    }
  }
  return n;
}

function evalParts(ps, me){
  const opp = 1-me;
  fillOcc(ps);
  const ready = [0,0];
  for(const p of ps) if(p.loc==="ready") ready[p.owner]++;

  let mat = 0;
  const crown=[0,0], door=[0,0], keep=[0,0], siege=[0,0], form=[0,0], tap=[-1,-1];

  for(const p of ps){
    if(p.loc!=="board") continue;
    const own = p.owner, foe = 1-own, s = (own===me ? 1 : -1);
    const code = CODE(p.sides), sh = NSH[code];
    const swordy = NSW[code] ? 1 : 0.25;
    const holds  = 0.5 + 0.30*sh;                 // shields make a piece hard to shift
    mat += s*VAL[code];

    /* An attack needs bodies. A piece advancing alone just dies, so offence is
       scaled by the company it keeps: full value once four friends are within
       three squares (five working together), and a small fraction alone. It is
       graded rather than a threshold so that gathering is rewarded at every
       step. Exempt: three or four shields, which go tapping and survive alone,
       and three or four swords, which are worth sending in as a distraction. */
    const sw = NSW[code];
    const soloist = sh>=3 || sw>=3;
    const dCrown = gd(p, HEADCELL[foe]);
    const dTheirForge = Math.abs(p.r-CREATE[foe][0]) + Math.abs(p.c-CREATE[foe][1]);
    let company = 1;
    if(!soloist && (dCrown<=8 || dTheirForge<=5))  // only pay for the scan where it can matter
      company = 0.12 + 0.88*Math.min(1, nearbyFriends(ps,p)/4);
    crown[own] += swordy * sharp(dCrown) * company;
    if(dCrown===1) door[own]++;                   // already on the doorstep: a real threat regardless

    const dOwnForge = Math.abs(p.r-CREATE[own][0]) + Math.abs(p.c-CREATE[own][1]);
    if(dTheirForge===0) tap[own] = p.id;
    else siege[own] += (1.1 + 0.55*sh) * soft(dTheirForge, 5) * company;
    if(dOwnForge===0) mat -= s*3;                 // squatting on your own forge stops your own production
    else keep[own] += holds * soft(dOwnForge, 4); // guarding it is never a penalty

    /* the ratchet: sword behind, shield in front. Useless alone; behind a
       friendly shield it is flung forward, and a line of them ratchets.   */
    for(const f of FWD[own]){
      const back = (f+2)%4;
      if(p.sides[back]!==SWORD || p.sides[f]!==SHIELD) continue;
      form[own] += 1.0;
      for(let t=1;t<=3;t++){
        const id = occAt(p.r+DIRS[back][0]*t, p.c+DIRS[back][1]*t);
        if(id>=0){ const b=ps[id]; if(b.owner===own && b.sides[f]===SHIELD) form[own] += 2.4/t; break; }
      }
      for(let t=1;t<=4;t++){
        const id = occAt(p.r+DIRS[f][0]*t, p.c+DIRS[f][1]*t);
        if(id>=0){ if(ps[id].owner!==own) form[own] += 2.2/t; break; }
      }
    }
  }

  /* A tap only hurts while there is still something in the box to build. */
  for(const w of [0,1]){
    if(tap[w]<0) continue;
    const victim = 1-w;
    const sh = NSH[CODE(ps[tap[w]].sides)];
    const worth = Math.min(ready[victim],12) * (1.7 + 0.25*sh);
    mat += (w===me ? worth : -worth);
    keep[victim] *= 3;                            // and pull the victim home to break it
  }

  const d = (a)=> a[me]-a[opp];
  return {
    overall: mat + 1.15*d(crown) + 5.5*d(door) + 1.30*d(keep) + 1.00*d(siege) + 0.90*d(form),
    attack:  mat + 2.20*crown[me] + 9*door[me] + 1.6*siege[me] + 1.3*form[me] - 0.4*crown[opp],
    safety:  mat - 2.20*crown[opp] - 9*door[opp] - 1.6*siege[opp] + 2.2*keep[me] + 0.4*crown[me]
  };
}

function evalStrong(ps, me){ return evalParts(ps, me).overall; }

/* the DAG walk. exhaustive while it fits in the caps, beam-pruned after. */
async function turnDAG(me, cfg, silent){
  const t0 = Date.now(), seen = new Set(), cands = [];
  let frontier = [], truncated = false;

  const expand = (node, a) => {          // returns list of child nodes, or "win"
    const c = simClone(node.ps);
    simAction(c, a);
    const res = resolveBranch(c, me, cfg.rxBranch);
    if(res.win) return "win";
    const kids = [];
    for(const st of res.states){
      const h = hashTurnState(st.ps, me);
      if(seen.has(h)) continue;
      seen.add(h);
      const plan = node.plan.concat([a], st.rx.map(i=>({kind:"rx", i})));
      kids.push({ps:st.ps, plan});
    }
    return kids;
  };

  if(!state.createDone){
    const root = {ps:simClone(state.pieces), plan:[]};
    for(const a of legalActions(state.pieces, me, "create")){
      const k = expand(root, a);
      if(k==="win") return {win:root.plan.concat([a])};
      frontier.push(...k);
    }
    if(!frontier.length) frontier = [{ps:simClone(state.pieces), plan:[{kind:"skip"}]}];
  } else {
    frontier = [{ps:simClone(state.pieces), plan:[]}];
  }
  cands.push(...frontier);

  for(let lvl=0; lvl<26; lvl++){
    const next = [];
    for(const node of frontier){
      for(const a of legalActions(node.ps, me, "move")){
        if(a.kind==="pass") continue;
        const k = expand(node, a);
        if(k==="win") return {win:node.plan.concat([a])};
        next.push(...k);
      }
      if(seen.size > cfg.states){ truncated = true; break; }        // deterministic bound
      if(Date.now()-t0 > cfg.searchMs){ truncated = true; break; }     // clock is only a backstop
    }
    if(!next.length) break;
    cands.push(...next);
    if(truncated){                       // out of budget: keep only the strongest lines
      for(const n of next) n.sc = evalStrong(n.ps, me);
      next.sort((a,b)=>b.sc-a.sc);
      frontier = next.slice(0, cfg.width);
      truncated = false;
      if(Date.now()-t0 > cfg.searchMs*1.6) break;
    } else frontier = next;
    if(!silent){
      aiViz.phase = "walking the turn DAG — "+(lvl+1)+" actions deep, "+
                    seen.size.toLocaleString()+" distinct positions";
      aiSeen = seen.size;
      await aiPaint();
    }
  }
  return {cands, states:seen.size, exhaustive:!truncated};
}

/* can the opponent win anywhere inside one whole turn? bounded. */
function enemyWinsInATurn(ps0, opp, cap, ms){
  const t0 = Date.now(), seen = new Set();
  let frontier = [{ps:ps0}];
  const step = (node, a) => {
    const c = simClone(node.ps); simAction(c, a);
    const res = resolveBranch(c, opp, 2);
    if(res.win) return "win";
    const kids = [];
    for(const st of res.states){
      const h = hashTurnState(st.ps, opp);
      if(seen.has(h)) continue;
      seen.add(h);
      kids.push({ps:st.ps});
    }
    return kids;
  };
  const creations = occMap(ps0).has(key(CREATE[opp][0],CREATE[opp][1]))
      ? [] : legalActions(ps0, opp, "create").filter(a=>a.kind==="create");
  for(const a of creations){ if(step(frontier[0], a)==="win") return true; }
  for(let lvl=0; lvl<26; lvl++){
    const next = [];
    for(const node of frontier){
      for(const a of legalActions(node.ps, opp, "move")){
        if(a.kind==="pass") continue;
        const k = step(node, a);
        if(k==="win") return true;
        next.push(...k);
      }
      if(seen.size>cap || Date.now()-t0>ms) return false;   // slack: give up, assume safe
    }
    if(!next.length) return false;
    frontier = next;
  }
  return false;
}

/* ---- the opponent's best whole turn, by the same exhaustive walk ----
   The evaluation is exactly antisymmetric, so their best leaf is our worst
   case: we score a candidate turn by what the board looks like AFTER they
   have answered it as well as they can.                                  */
function replyBest(ps0, opp, cfg){
  const me = 1-opp;
  const t0 = Date.now(), seen = new Set();
  let frontier = [{ps:ps0}], best = evalStrong(ps0, opp), truncated = false;
  const topLeaves = [];                       // their strongest answers, for the counter search
  const remember = (st,v)=>{
    if(!cfg.counter) return;
    topLeaves.push({ps:st, v});
    if(topLeaves.length>24){ topLeaves.sort((a,b)=>b.v-a.v); topLeaves.length = 8; }
  };
  const step = (node, a) => {
    const c = simClone(node.ps); simAction(c, a);
    const res = resolveBranch(c, opp, 2);
    if(res.win) return "win";
    const kids = [];
    for(const st of res.states){
      const h = hashTurnState(st.ps, opp);
      if(seen.has(h)) continue;
      seen.add(h);
      const v = evalStrong(st.ps, opp);
      if(v>best) best = v;
      remember(st.ps, v);
      kids.push({ps:st.ps, sc:v});
    }
    return kids;
  };
  if(!occMap(ps0).has(key(CREATE[opp][0], CREATE[opp][1]))){
    for(const a of legalActions(ps0, opp, "create")){
      if(a.kind!=="create") continue;
      const k = step(frontier[0], a);
      if(k==="win") return {win:true};
      frontier.push(...k);
    }
  }
  for(let lvl=0; lvl<26; lvl++){
    const next = [];
    for(const node of frontier){
      for(const a of legalActions(node.ps, opp, "move")){
        if(a.kind==="pass") continue;
        const k = step(node, a);
        if(k==="win") return {win:true};
        next.push(...k);
      }
      if(seen.size>cfg.foeStates){ truncated = true; break; }
      if(Date.now()-t0>cfg.foeMs){ truncated = true; break; }
    }
    if(!next.length) break;
    if(truncated){
      next.sort((a,b)=>b.sc-a.sc);
      frontier = next.slice(0, cfg.foeWidth);
      truncated = false;
      if(Date.now()-t0 > cfg.foeMs*1.5) break;
    } else frontier = next;
  }
  if(cfg.counter && topLeaves.length){
    topLeaves.sort((a,b)=>b.v-a.v);
    let worst = Infinity;                     // they pick the answer that leaves me worst off
    for(const leaf of topLeaves.slice(0,3)){
      const mine = buildTurn(freshFor(leaf.ps, me), me, 0);
      const v = mine.won ? 1e6 : evalStrong(mine.ps, me);
      if(v<worst) worst = v;
    }
    return {win:false, best:-worst};          // caller negates, so this stays "their best"
  }
  return {win:false, best};
}

/* ---- the turn ---- */
async function planStrong(me, cfg){
  const t0 = Date.now();
  RESOLVE_STRONG = true;
  try{
    aiViz.phase = "walking the turn DAG"; aiViz.attempt = 1; aiViz.tries = 1;
    const r = await turnDAG(me, cfg);
    if(r.win) return {plan:r.win, winning:true};
    if(!r.cands.length) return {plan:[], safe:false};

    const opp = 1-me;
    for(const c of r.cands) c.p = evalParts(c.ps, me);
    // three different opinions about what "best" means; walk all three at once
    const lists = ["overall","attack","safety"].map(kind=>
      r.cands.slice().sort((a,b)=> b.p[kind]-a.p[kind]));
    const order = [], taken = new Set();
    for(let i=0; i<cfg.consider; i++)
      for(const L of lists){
        const c = L[i];
        if(c && !taken.has(c)){ taken.add(c); order.push(c); }
      }

    aiViz.tries = order.length;
    let bestPlan = order[0].plan, bestScore = -Infinity, scored = 0;
    for(let i=0;i<order.length;i++){
      aiViz.attempt = i+1;
      aiViz.phase = "playing out your whole best answer to each candidate turn";
      const r = replyBest(order[i].ps, opp, cfg);
      const sc = r.win ? -1e9 : -r.best;      // antisymmetric: their best is our worst case
      scored++;
      if(sc > bestScore){ bestScore = sc; bestPlan = order[i].plan; }
      aiViz.safe = bestScore > -1e8;
      if((i&1)===0) await aiPaint(true);
      // the clock may never cut in before the head of every heuristic list has been judged
      if(i+1 >= cfg.minScored && Date.now()-t0 > cfg.ms) break;
    }
    aiViz.phase = "scored "+scored+" candidate turns against your best answer";
    await aiPaint(true);
    return {plan:bestPlan, safe:bestScore > -1e8};
  } finally { RESOLVE_STRONG = false; }
}

/* ============================ game record ============================
   Every action is stored in state.rec as a token, so undo and restart-turn
   rewind the record for free. A record replays deterministically: the tokens
   are the moves themselves, and reaction lists are a pure function of the
   position, so an X token always resolves the same reaction.              */

function recordText(){
  const res = !state.gameOver ? "unfinished"
            : state.gameOver.draw ? "draw"
            : PNAME[state.gameOver.winner].toLowerCase()+" wins by "+(state.gameOver.reason||"head");
  let s = "SNS1|"+state.meta.ai.join(",")+"|"+res+"\n";
  s += state.rec.join(" ")+"\n";
  s += "\n# ---- readable log ----\n";
  s += state.log.map(l=>"# "+l.replace(/^\* /,"")).join("\n")+"\n";
  return s;
}
/* one token from the record, applied to the live game. shared by the record
   loader and by online play, so a remote turn takes exactly the path a
   replayed one does. */
function applyToken(tok){
  const k = tok[0], a = tok.slice(1).split(".");
  if(k==="C") createPiece(+a[0], +a[1]);
  else if(k==="S") skipCreation();
  else if(k==="M") movePiece(+a[0], +a[1]);
  else if(k==="R") rotatePiece(+a[0], +a[1]);
  else if(k==="X") rxClick(+a[0]);
  else if(k==="E") endTurnBtn();
  else if(k==="Q"){
    snapshot(); recPush(tok);
    state.gameOver = {winner:1-(+a[0]), reason:"surrender"};
    logMsg(PNAME[+a[0]]+" surrenders. "+PNAME[1-(+a[0])]+" wins.", true);
    if(!fastReplay) render();
  }
}
function replayFrom(text){
  const toks = [];
  let ai = ["human","human"];
  for(const ln of String(text).split(/\r?\n/)){
    const t = ln.trim();
    if(!t || t.startsWith("#")) continue;
    if(t.startsWith("SNS1|")){ const p=t.split("|"); if(p[1]) ai = p[1].split(","); continue; }
    for(const tok of t.split(/\s+/)) if(/^[CSMRXEQ]/.test(tok)) toks.push(tok);
  }
  netReset();
  AI = [false,false];
  fastReplay = true;
  newGame();
  let done = 0, failed = null;
  for(const tok of toks){
    const before = state.rec.length;
    applyToken(tok);
    if(state.rec.length===before){ failed = tok; break; }
    done++;
    if(state.gameOver) break;
  }
  fastReplay = false;
  AI = [ai[0]==="human"?false:ai[0], ai[1]==="human"?false:ai[1]];
  state.meta = {ai};
  aiPaused = true;                       // never let the computer run off with a loaded game
  render();
  return {done, total:toks.length, failed};
}

function openRecord(){
  document.getElementById("record").hidden = false;
  document.getElementById("recText").value = recordText();
  document.getElementById("recStatus").textContent =
    state.rec.length+" actions recorded"+(state.gameOver?" · game finished":"");
}
function copyRecord(){
  const ta = document.getElementById("recText");
  ta.select(); ta.setSelectionRange(0, 999999);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  if(!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>{
    document.getElementById("recStatus").textContent = "copied to clipboard";
  });
  else document.getElementById("recStatus").textContent = ok ? "copied to clipboard" : "select the text above and copy";
}
function loadRecord(){
  const r = replayFrom(document.getElementById("recIn").value);
  document.getElementById("recStatus").textContent =
    r.failed ? ("replayed "+r.done+" of "+r.total+" actions, then '"+r.failed+"' did not apply")
             : ("replayed all "+r.done+" actions — the computer is paused");
  document.getElementById("recText").value = recordText();
}
function downloadRecord(){
  const blob = new Blob([recordText()], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "swords-record.txt";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---------- new game setup ---------- */
let setupSel = ["human","medium"];
let setupOnline = false;
const AILABEL = {easy:"AI_LV1", medium:"AI_LV2", hard:"AI_LV3"};
const esc = t => String(t==null?"":t).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================= ONLINE PLAY =============================
   Trystero does WebRTC matchmaking with no server of ours: two browsers that
   join the same room name find each other and talk directly. What crosses the
   wire is the game record itself — the same token stream the Record dialog
   shows — so a remote turn arrives as tokens and is replayed through exactly
   the code path a loaded record uses. No rule lives in here.

   Occupancy: on joining we greet every peer with our phase. A peer already
   playing answers "busy" and we bounce the name back to the user. Otherwise
   everyone waiting in the room sorts the peer ids and the two lowest pair up
   — both sides compute the same pair and the same seats, with no handshake.
   The lower id becomes Ivory and moves first.                             */

const TRYSTERO_URL = "https://esm.run/trystero@0.25.3";
const APPID = "sns-swords-and-shields-a81f92";
const NETV = 1;
const HB_MS = 2000;      // how often we announce ourselves
const GONE_MS = 8000;    // no word for this long and we forget a waiting peer
/* There used to be no inactivity limit inside a game at all: a partner was
   only lost when the transport itself gave up, which a frozen tab may never
   do. Twelve seconds against a two second heartbeat is six missed beats. */
const PEER_GONE_MS = 12000;
const APPOINT_MS = 6000; // leave a handed-out seat this long before re-offering
const OFFER_MS = 1500;   // resend an unanswered offer this often
const COMMIT_MS = 7000;  // give up waiting for a confirm

const net = { on:false, phase:"off", room:null, sendRec:null, hi:null,
              role:"free", seat:null, peer:null, name:"", roster:new Map(),
              openSeat:null, appoint:null,
              offer:null, commit:null, hbTimer:null, trace:[], lastSent:null,
              applying:false, calling:false, lost:false, base:0, err:"" };
let trystero = null, netProbeTimer = null;

/* true whenever the local player must keep their hands off the board */
function netLocked(){ return net.on && (net.applying || net.lost || state.turn!==net.seat); }

function netSend(){
  if(!net.on || !net.sendRec) return;
  try { net.sendRec(state.rec.join(" ")); }
  catch(e){ console.error("online: send failed", e); }
}
/* called from render(), so every path that changes the record — moving,
   rotating, resolving, creating, undoing, restarting the turn, ending it,
   surrendering — streams out without each one having to remember to. */
function netPush(){
  if(!net.on || net.role!=="player") return;
  if(net.calling || net.applying || net.lost) return;
  const s = state.rec.join(" ");
  if(s === net.lastSent) return;
  net.lastSent = s;
  netSend();
}

/* ------------------------- finding a partner -------------------------
   Two rules, learned the hard way. First, a peer is only real while it
   keeps saying so: everyone announces themselves every couple of seconds
   and an entry that goes quiet is forgotten, so a session that died
   without a goodbye cannot be paired with or counted. Second, nothing
   here ever throws you out. A pairing needs a full offer / accept /
   confirm, and each side starts only once it knows the other knows; if
   somebody else is playing under this name you are told so and left to
   decide, never bounced. The room is shown to you as it is seen, which
   is also what makes the next surprise diagnosable.                   */

const netShort = id => String(id||"").slice(0,4);
function netTrace(t){
  net.trace.push(new Date().toLocaleTimeString().slice(0,8)+"  "+t);
  if(net.trace.length>9) net.trace.shift();
}
function netFree(){ return (net.phase==="probe" || net.phase==="wait") && !net.on; }
function netMyPair(){ return net.on ? [trystero.selfId, net.peer].sort() : null; }
/* Trystero's API, exactly: send(data, {target}) and onMessage(data, {peerId}).
   Getting either of those wrong is silent — a bad `target` just broadcasts —
   so every message also carries `from` and `to` as plain strings and the
   receiver filters on those. Targeting is then only an optimisation.      */
function peerIdOf(meta){
  if(typeof meta === "string") return meta;             // tolerate an older shape
  return (meta && (meta.peerId || meta.id)) || null;
}
function netTo(id, m){
  if(!net.hi || !trystero) return;
  const msg = Object.assign({v:NETV, from:trystero.selfId, to:id || null}, m);
  try { net.hi.send(msg, id ? {target:id} : undefined); }
  catch(e){ netTrace("send failed: "+e.message); }
}
function netForMe(m){ return !m.to || m.to === trystero.selfId; }
function netHello(target, re){
  if(!net.hi || !trystero) return;
  netTo(target, {t:"hello", free:netFree(), pair:netMyPair(), re:!!re,
                 role:net.role, seat:net.seat, open:net.openSeat});
}
function netLive(){
  const now = Date.now(), out = [];
  for(const [id,e] of net.roster) if(now-e.at < GONE_MS) out.push([id,e]);
  return out;
}

/* --- the handshake --- */
function netClearOffer(){ if(net.offer && net.offer.timer) clearTimeout(net.offer.timer); net.offer = null; }
function netClearCommit(){ if(net.commit && net.commit.timer) clearTimeout(net.commit.timer); net.commit = null; }

function netTryPair(){
  if(net.on || net.offer || net.commit || !netFree() || !trystero) return;
  const me = trystero.selfId;
  /* A game already under way is joined as a spectator, never interrupted.
     If a seat is standing empty its player will hand it over — we do not
     grab it, so that the seat always goes to whoever has waited longest. */
  if(netLive().some(([,e]) => e.role==="player")){ netWatch(); return; }
  const free = netLive().filter(([,e]) => e.free).map(([id]) => id).sort();
  if(!free.length) return;
  if(free.some(id => id < me)) return;            // the lower id does the asking
  net.offer = { to:free[0], nonce:Math.random().toString(36).slice(2,10), tries:0 };
  netTrace("offering to "+netShort(free[0]));
  netPushOffer();
}
function netPushOffer(){
  if(!net.offer || net.on) return;
  if(net.offer.tries++ >= 6){ netTrace("no answer from "+netShort(net.offer.to)); netClearOffer(); drawSetup(); return; }
  netTo(net.offer.to, {t:"offer", nonce:net.offer.nonce});
  net.offer.timer = setTimeout(netPushOffer, OFFER_MS);
}
/* ---------------- spectating, and stepping in ----------------
   Anyone arriving at a game in progress watches it. When a seat falls empty
   — someone closed the tab, or simply went quiet — the player still at the
   board hands it to the spectator who has been here longest, along with the
   record so far, and play carries on. That is also what lets a player who
   crashed rejoin the same game name and pick up their own side. */

function netWatch(silent){
  if(net.role==="watch") return;
  netClearOffer(); netClearCommit();
  if(netProbeTimer){ clearTimeout(netProbeTimer); netProbeTimer = null; }
  net.role="watch"; net.on=true; net.seat=null; net.peer=null;
  net.openSeat=null; net.lost=false; net.phase="play"; net.base=0; net.lastSent=null;
  AI=[false,false]; aiPaused=false;
  document.getElementById("setup").hidden = true;
  newGame();
  state.meta = {ai:["online","online"]};
  if(!silent) netTrace("watching");
  logMsg("Watching \u201c"+net.name+"\u201d.", true);
  for(const [id,e] of netLive()) if(e.role==="player") netTo(id, {t:"catchup"});
  netHello(null, true);
  render();
}
function netUnwatch(){                      // the game we were watching is gone
  net.role="free"; net.on=false; net.seat=null; net.peer=null;
  net.openSeat=null; net.lost=false; net.phase="wait"; net.base=0;
  netTrace("nobody left playing");
  document.getElementById("setup").hidden = false;
  netHello(null, false); drawSetup();
}
function netTakeSeat(peerId, seat, recStr){
  if(seat!==0 && seat!==1) return;
  netClearOffer(); netClearCommit();
  if(netProbeTimer){ clearTimeout(netProbeTimer); netProbeTimer = null; }
  const fresh = net.role!=="watch";
  net.role="player"; net.on=true; net.seat=seat; net.peer=peerId;
  net.openSeat=null; net.lost=false; net.phase="play";
  AI=[false,false]; aiPaused=false;
  document.getElementById("setup").hidden = true;
  if(fresh){ newGame(); state.meta = {ai:["online","online"]}; }
  netTrace("seated as "+PNAME[seat]);
  logMsg("You are now playing "+PNAME[seat]+".", true);
  netTo(peerId, {t:"seated", seat});
  netHello(null, true);
  net.lastSent = null;
  netApply(String(recStr==null ? "" : recStr));
}

/* our partner has gone: offer their seat to the longest-waiting spectator */
function netPeerGone(){
  if(net.role!=="player" || net.openSeat!=null) return;
  netTrace(netShort(net.peer)+" went quiet");
  logMsg(PNAME[1-net.seat]+" has dropped out.", true);
  net.peer = null; net.openSeat = 1-net.seat; net.appoint = null;
  netTryAppoint();
}
function netTryAppoint(){
  if(net.role!=="player" || net.openSeat==null || !trystero) return;
  if(net.appoint && Date.now()-net.appoint.at < APPOINT_MS) return;   // give them time
  const cands = netLive()
    .filter(([id,e]) => id!==trystero.selfId && e.role!=="player")
    .sort((a,b) => (a[1].first||0) - (b[1].first||0));                // longest here first
  if(!cands.length){
    if(!net.lost){ net.lost = true; render(); }
    return;
  }
  const id = cands[0][0];
  net.appoint = {to:id, at:Date.now()};
  netTrace("offering "+PNAME[net.openSeat]+" to "+netShort(id));
  netTo(id, {t:"seat", seat:net.openSeat, rec:state.rec.join(" ")});
}

function netBegin(two){
  if(net.on || !trystero) return;
  netClearOffer(); netClearCommit();
  if(netProbeTimer) clearTimeout(netProbeTimer);
  net.seat = two.indexOf(trystero.selfId);
  net.peer = two[1-net.seat];
  net.phase = "play"; net.on = true; net.role = "player"; net.openSeat = null;
  netTrace("paired with "+netShort(net.peer)+" as "+PNAME[net.seat]);
  netHello(null, true);                            // the room is busy now
  netStartGame();
}

async function netJoin(rawName){
  const name = String(rawName==null?"":rawName).trim();
  if(name.length < 2){ net.err = "Give the game a name of at least two characters."; drawSetup(); return; }
  netReset();
  net.name = name; net.err = ""; net.phase = "connecting"; drawSetup();

  let T;
  try { T = trystero || (trystero = window.TRYSTERO || await import(TRYSTERO_URL)); }
  catch(e){ net.phase="off"; net.err="Could not load the peer-to-peer library — are you online?"; drawSetup(); return; }

  let room;
  try { room = T.joinRoom({appId:APPID}, "sns-"+name.toLowerCase().replace(/\s+/g,"-").slice(0,40)); }
  catch(e){ net.phase="off"; net.err="Could not open that room: "+e.message; drawSetup(); return; }

  net.room = room; net.phase = "probe"; net.roster = new Map(); net.trace = [];
  const hi = room.makeAction("hi"), rec = room.makeAction("rec");
  net.hi = hi;
  net.sendRec = d => rec.send(d);            // broadcast: watchers follow along too
  netTrace("joined as "+netShort(T.selfId));

  room.onPeerJoin = id => { netTrace("saw "+netShort(id)); netHello(id, false); };
  room.onPeerLeave = id => {
    net.roster.delete(id);
    netTrace(netShort(id)+" left");
    if(net.offer && net.offer.to===id) netClearOffer();
    if(net.commit && net.commit.to===id) netClearCommit();
    if(net.on && net.role==="player" && id===net.peer && !state.gameOver){
      netPeerGone();
    } else if(net.on && net.role==="watch"){
      if(!netLive().some(([,e]) => e.role==="player")) netUnwatch();
    } else if(!net.on) drawSetup();
  };

  hi.onMessage = (m, meta) => {
    const id = peerIdOf(meta);
    if(!m || !trystero) return;
    if(!id){ netTrace("message with no peer id — API mismatch"); return; }
    if(!netForMe(m)) return;                     // addressed to somebody else
    if(m.t==="hello"){
      const was = net.roster.get(id);
      net.roster.set(id, {free:!!m.free, pair:m.pair||null, role:m.role||"free",
                          seat:(m.seat==null?null:m.seat), open:(m.open==null?null:m.open),
                          at:Date.now(), first:(was && was.first) || Date.now()});
      if(net.role==="player" && net.openSeat!=null) netTryAppoint();
      /* a tab that froze and then thawed still believes it is playing; its
         seat has since been handed on, so tell it to sit down and watch */
      if(net.role==="player" && net.peer && id!==net.peer &&
         m.role==="player" && m.seat===1-net.seat) netTo(id, {t:"unseat"});
      if(!m.re) netHello(id, true);
      if(!net.on && m.pair && m.pair.indexOf(trystero.selfId) >= 0){
        netTrace(netShort(id)+" says we are paired");      // a lost confirm, recovered
        netBegin(m.pair.slice().sort());
        return;
      }
      netTryPair();
      if(!net.on) drawSetup();
      return;
    }
    if(m.t==="offer"){
      if(net.on || net.commit || !netFree()){ netTo(id, {t:"decline"}); return; }
      net.commit = {to:id, nonce:m.nonce};
      net.commit.timer = setTimeout(()=>{ netTrace("no confirm from "+netShort(id)); netClearCommit(); drawSetup(); }, COMMIT_MS);
      netTrace("accepting "+netShort(id));
      netTo(id, {t:"accept", nonce:m.nonce});
      drawSetup();
      return;
    }
    if(m.t==="accept"){
      if(!net.offer || net.offer.to!==id || net.offer.nonce!==m.nonce) return;
      netTo(id, {t:"confirm", nonce:m.nonce});
      netBegin([trystero.selfId, id].sort());
      return;
    }
    if(m.t==="confirm"){
      if(!net.commit || net.commit.to!==id || net.commit.nonce!==m.nonce) return;
      netBegin([trystero.selfId, id].sort());
      return;
    }
    if(m.t==="decline"){
      netTrace(netShort(id)+" declined");
      if(net.offer && net.offer.to===id) netClearOffer();
      net.roster.set(id, {free:false, pair:null, role:"free", seat:null, open:null,
                          at:Date.now(), first:Date.now()});
      drawSetup();
      return;
    }
    if(m.t==="catchup"){                       // a watcher wants the game so far
      if(net.role==="player"){ net.lastSent = null; netSend(); }
      return;
    }
    if(m.t==="seat"){                          // we are being handed a vacant seat
      if(net.role==="player") return;
      netTakeSeat(id, m.seat, m.rec);
      return;
    }
    if(m.t==="seated"){                        // somebody took the seat we offered
      if(net.role!=="player") return;
      if(net.openSeat==null || m.seat!==net.openSeat){
        if(id!==net.peer) netTo(id, {t:"unseat"});   // too late, a race
        return;
      }
      net.peer = id; net.openSeat = null; net.appoint = null; net.lost = false;
      net.lastSent = null;                     // make sure they get the record
      netTrace(netShort(id)+" took "+PNAME[m.seat]);
      logMsg(PNAME[m.seat]+" is taken over by another player.", true);
      netHello(null, true); render();
      return;
    }
    if(m.t==="unseat"){                        // we lost that race; go back to watching
      if(net.role==="player" && net.peer===id){ netWatch(true); }
      return;
    }
  };
  rec.onMessage = (payload, meta) => {
    if(!net.on) return;
    const id = peerIdOf(meta);
    if(net.role==="watch"){ netApply(payload); return; }
    if(id === net.peer) netApply(payload);
  };

  netHello(null, false);
  net.hbTimer = setInterval(netTick, HB_MS);
  netProbeTimer = setTimeout(()=>{ if(net.phase==="probe"){ net.phase="wait"; drawSetup(); } }, 3000);
  drawSetup();
  window.SNSNET = net;                             // for poking at from the console
}

/* the heartbeat: announce, forget the silent, try again, refresh the card */
function netTick(){
  if(!net.room){ if(net.hbTimer){ clearInterval(net.hbTimer); net.hbTimer=null; } return; }
  if(net.on){
    netHello(null, true);                            // every beat once a game is on
    const now = Date.now();
    if(net.role==="player"){
      if(net.peer){
        const e = net.roster.get(net.peer);
        if(!e || now-e.at >= PEER_GONE_MS) netPeerGone();
      }
      if(net.openSeat!=null) netTryAppoint();
    } else if(net.role==="watch"){
      const players = netLive().filter(([,e]) => e.role==="player");
      if(!players.length) netUnwatch();
      else if(!state.rec.length) for(const [id] of players) netTo(id, {t:"catchup"});
    }
    return;
  }
  const now = Date.now();
  for(const [id,e] of net.roster) if(now-e.at >= GONE_MS){ net.roster.delete(id); netTrace(netShort(id)+" went quiet"); }
  netHello(null, false);
  netTryPair();
  drawSetup();
}

function netCancel(){
  const n = net.name;
  netReset();
  net.name = n; net.err = ""; setupOnline = true;
  document.getElementById("setup").hidden = false;
  drawSetup();
}
function netAnother(){ netCancel(); }
function netReset(){
  if(netProbeTimer) clearTimeout(netProbeTimer);
  netProbeTimer = null;
  netClearOffer(); netClearCommit();
  if(net.hbTimer) clearInterval(net.hbTimer);
  if(net.room){ try { net.room.leave(); } catch(e){} }
  net.on=false; net.phase="off"; net.room=null; net.sendRec=null; net.hi=null; net.hbTimer=null;
  net.role="free"; net.seat=null; net.peer=null; net.roster=new Map();
  net.openSeat=null; net.appoint=null;
  net.applying=false; net.calling=false; net.lost=false; net.base=0; net.lastSent=null;
}

/* An undo shortens the record, so a remote update is not always an
   extension. When it is, we play the new tokens out one at a time. When it
   is not, we rebuild the position from the tokens we were given and hand
   the old positions to render(), which animates the pieces back — an undo
   at the far end looks like an undo here.                               */
function netRebuild(toks){
  const prev = capture();
  const savedLog = state.log.slice(), savedMeta = state.meta;
  const wasFast = fastReplay;
  fastReplay = true; net.calling = true;
  try {
    newGame();
    for(const t of toks) applyToken(t);
  } finally { net.calling = false; fastReplay = wasFast; }
  state.log = savedLog; state.meta = savedMeta;
  deaths.clear(); pendingFx = []; spinHint = null; sel = null;
  render(prev);
}

/* remote turns are played out one action at a time so they animate */
const NETPACE = t => t[0]==="M" ? 520 : t[0]==="X" ? 700 : t[0]==="C" ? 620 : t[0]==="E" ? 220 : 380;

let netQueue = null;

async function netApply(payload){
  if(!net.on || net.lost) return;
  const str = String(payload==null ? "" : payload).trim();
  /* never let a remote message unwind actions we have not committed yet */
  if(state.turn===net.seat && state.rec.length > net.base) return;
  netQueue = str;
  if(net.applying) return;                 // the running loop will pick it up
  net.applying = true;
  try {
    while(netQueue !== null){
      const target = netQueue; netQueue = null;
      await netApplyOne(target);
    }
  } finally {
    net.applying = false;
    net.base = state.rec.length;
    netQueue = null;
    render();
  }
}

async function netApplyOne(str){
  const toks = str ? str.split(/\s+/) : [];
  const mine = state.rec.slice();
  let common = 0;
  while(common<toks.length && common<mine.length && toks[common]===mine[common]) common++;

  if(common===mine.length && toks.length>mine.length){          // they did more
    sel = null; flash = "";
    for(let i=mine.length; i<toks.length; i++){
      if(i>mine.length) await sleep(NETPACE(toks[i]));
      if(net.lost) break;
      net.calling = true;
      try { applyToken(toks[i]); } finally { net.calling = false; }
      if(state.gameOver) break;
    }
  } else if(common===toks.length && toks.length<mine.length){   // they took it back
    logMsg((net.seat==null ? "That side" : PNAME[1-net.seat])+(mine.length-toks.length===1
      ? " takes an action back." : " takes "+(mine.length-toks.length)+" actions back."));
    netRebuild(toks);
  } else if(common!==mine.length || toks.length!==mine.length){ // shouldn't happen
    logMsg("Re-syncing with your opponent.");
    netRebuild(toks);
  }
  net.lastSent = str;
}

function netStartGame(){
  AI = [false,false]; aiPaused = false; net.role = "player";
  document.getElementById("setup").hidden = true;
  newGame();
  state.meta = {ai:["online","online"]};
  net.base = state.rec.length; net.lastSent = state.rec.join(" ");
  logMsg("Online game \u201c"+net.name+"\u201d — you play "+PNAME[net.seat]+
         (net.seat===0 ? ", and move first." : "."), true);
  render();
}

/* ---------- the setup card ---------- */
function openSetup(){
  const go = document.getElementById("gameover"); if(go) go.remove();
  document.getElementById("setup").hidden = false; drawSetup();
}
function drawSetup(){
  const card = document.getElementById("setupCard");

  if(net.phase==="connecting" || net.phase==="probe" || net.phase==="wait"){
    const live = netLive();
    const free = live.filter(([,e]) => e.free);
    const busy = live.filter(([,e]) => !e.free);
    const msg = net.phase==="connecting" ? "Opening the connection\u2026"
              : net.commit ? "Agreeing sides with "+netShort(net.commit.to)+"\u2026"
              : net.offer  ? "Asking "+netShort(net.offer.to)+" to play\u2026"
              : net.phase==="probe" ? "Looking for anyone else here\u2026"
              :                       "Waiting for your friend.";
    let who = "";
    if(live.length){
      who = '<p class="hint">In this room: '+live.map(([id,e]) =>
              '<b>'+netShort(id)+'</b> '+(e.role==="player" ? (e.open!=null ? "playing, a seat free" : "playing")
                                       : e.role==="watch" ? "watching" : "free")).join(", ")+'</p>';
    }
    const stuck = busy.length && !free.length && !net.offer && !net.commit;
    card.innerHTML =
      '<h3>Online play</h3>'+
      '<p style="font-size:16px;margin:4px 0 10px">Game name: <span class="netname">'+esc(net.name)+'</span>'+
      (trystero ? ' <span class="hint">&nbsp;you are '+netShort(trystero.selfId)+'</span>' : '')+'</p>'+
      '<p><span class="think"></span> &nbsp;'+msg+'</p>'+ who +
      (stuck
        ? '<p class="netmsg">A game is already running under this name. You will watch it, and take '+
          'over a seat if one of them drops out.</p>'
        : net.phase==="wait"
          ? '<p class="hint">Have your friend open this same page, choose <b>Online play</b>, and type exactly '+
            'that name. The game begins the moment you find each other — keep this tab open.</p>' : '')+
      '<p style="margin-top:14px"><button onclick="netCancel()">Stop waiting</button> '+
      '<button class="primary" onclick="netAnother()">Use another name</button></p>'+
      (net.trace.length
        ? '<pre style="margin-top:12px;font-size:11px;color:#6f8090;background:#0e1319;border:1px solid #2a3540;'+
          'border-radius:8px;padding:6px;overflow:auto;max-height:104px">'+esc(net.trace.join("\n"))+'</pre>' : '');
    return;
  }

  let s = '<h3>New game</h3>';
  [0,1].forEach(o=>{
    s += '<p style="margin:10px 0 4px"><span class="dot" style="background:'+P_FILL[o]+';border:1px solid '+P_EDGE[o]+
         '"></span> <b>'+PNAME[o]+'</b> <span class="hint">('+(o===0?"top, moves first, starts with the blank piece":"bottom")+')</span></p>'+
         '<div class="btns" style="max-width:330px">'+
         ["human","easy","medium","hard"].map(v=>
           '<button'+(!setupOnline && setupSel[o]===v?' class="primary"':'')+
           ' onclick="setupOnline=false;setupSel['+o+']=\''+v+'\';drawSetup()">'+
           (v==="human"?"Human":AILABEL[v])+'</button>').join('')+
         '</div>';
  });

  s += '<div class="netbox"><div class="btns">'+
       '<button class="wide'+(setupOnline?' primary':'')+'" onclick="setupOnline=!setupOnline;drawSetup()">'+
       (setupOnline?'&#10003; ':'')+'&#127760; Online play &mdash; against a friend, over the internet</button></div>';
  if(setupOnline){
    s += '<p class="cap" style="margin:10px 0 0">Game name &mdash; agree one with your friend</p>'+
         '<input id="netName" value="'+esc(net.name)+'" placeholder="for instance  marco-vs-leo" '+
         'onkeydown="if(event.key===\'Enter\')netJoin(this.value)">'+
         '<div class="btns" style="margin-top:6px">'+
         '<button class="wide primary" onclick="netJoin(document.getElementById(\'netName\').value)">'+
         'Connect &#9654;</button></div>'+
         '<p class="hint" style="margin:8px 0 0">Whichever of you arrives first waits for the other; sides are '+
         'handed out automatically. Play goes browser to browser, with nothing stored anywhere.</p>';
    if(net.err) s += '<p class="netmsg">'+esc(net.err)+'</p>';
  }
  s += '</div>';

  s += '<p style="margin-top:16px">'+
       '<button class="primary" onclick="startGame()"'+(setupOnline?' disabled':'')+'>Start</button> '+
       '<button onclick="document.getElementById(\'setup\').hidden=true">Cancel</button></p>';
  card.innerHTML = s;
  if(setupOnline){ const i = document.getElementById("netName"); if(i){ i.focus(); i.select(); } }
}
function startGame(){
  netReset();
  aiPaused = false;                  // a loaded record leaves the computer paused
  AI = [setupSel[0]==="human"?false:setupSel[0], setupSel[1]==="human"?false:setupSel[1]];
  document.getElementById("setup").hidden = true;
  newGame();
  aiMaybeStart();
}

fit();
newGame();
openSetup();
</script>
