<!DOCTYPE html>
<html lang="en">

  <title>BrickWall Minigame</title>
  <link rel="stylesheet" href="../../resources/FontsSetUp.css">
  <link rel="stylesheet" href="../../resources/BaseStyle.css">
  <link rel="stylesheet" href="../../resources/RoundButtonsStyle.css">

<body  data-next="../Level606/Level606.html">
          <div id="gameArea">
            <div>
              <div id="brickWall"><div class="row" data-length="20"><div class="brick immovable" data-length="5" data-code="World" data-movable="false" data-index="0">World</div><div class="brick movable" data-length="6" data-code="Hello" data-movable="true" data-index="5">Hello</div></div><div class="row" data-length="25"><div class="brick movable" data-length="5" data-code="Row2" data-movable="true" data-index="0">Row2</div><div class="brick movable" data-length="6" data-code="Roow" data-movable="true" data-index="5">Roow</div></div></div>
			</div>
            <div>
              <div id="brickPile"><div class="brick movable" data-length="5" data-code="Hii" data-movable="true">Hii</div><div class="brick movable" data-length="6" data-code="Direct" data-movable="true">Direct</div><div class="brick movable" data-length="3" data-code="ion" data-movable="true">ion</div></div>
            </div>
          </div>

  <div id="screenOverlay"></div>
  <div id="gameMessage" class="messageBox" style="display: none;"></div>
