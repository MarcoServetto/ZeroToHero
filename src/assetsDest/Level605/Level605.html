<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrickWall Minigame</title>
  <link rel="stylesheet" href="../../resources/FontsSetUp.css">
  <link rel="stylesheet" href="../../resources/BaseStyle.css">
  <link rel="stylesheet" href="../../resources/RoundButtonsStyle.css">
  <link rel="stylesheet" href="../../resources/brickWall/BrickWall.css">

<body  data-next="../Level606/Level606.html">


<div id="gameArea">
  <div class="topLeft">
    <div id="wall" class="wall">
      <span class="brickRow" data-length="30">
		<span class="brick">h</span><span class="brick movable">hello</span>
	  </span>
	  <span class="brickRow" data-length="40">
        <span class="brick">h</span><span class="brick movable">bye</span>
      </span>
    </div>
  </div>
  <div class="brickPile">
	<span class="brick movable">Hii</span><span class="brick movable">Direct</span><span class="brick movable">ion</span>
  </div>

  <div id="screenOverlay"></div>
  <div id="gameMessage" class="messageBox" style="display: none;"></div>
  <div id="levelEndCharacter" class="divFullScreenImage" hidden>
    <img src="../../resources/weDidIt.png" alt="We did it!" draggable="false">
    </div>
</div>


</body>
</html>
