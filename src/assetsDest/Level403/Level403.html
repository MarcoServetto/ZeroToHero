<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest Minigame</title>
  <link rel="stylesheet" href="../../resources/FontsSetUp.css">
  <link rel="stylesheet" href="../../resources/BaseStyle.css">
  <link rel="stylesheet" href="../../resources/RoundButtonsStyle.css">
  <link rel="stylesheet" href="../../resources/forest/Forest.css">
  <script type="text/javascript" src="../../resources/BaseJs.js" defer></script>
  <script type="text/javascript" src="../../resources/forest/Forest.js" defer></script>
</head>
<body  data-next="../Level404/Level404.html">
          <div id="gameArea">
			<svg class="forest" viewBox="0 0 2100 1000">
              <image
                href="../../resources/forest/forestDawn.png"
                x="0" y="0"
                width="100%"
                height="100%"
                preserveAspectRatio="xMidYMid slice"
                />
              <g class="edge" data-edge="edge_0" onclick='travelPath("edge_0", 150, 150, 350.00, 50.00, 550, 150)'>
  <path class="hitPath" d='m 150 150 Q 350.00 50.00 550 150'/>
  <path class='path' d='m 150 150 Q 350.00 50.00 550 150' stroke-dasharray="16 16"/>
</g><g class="edge" data-edge="edge_1" onclick='travelPath("edge_1", 150, 150, 350.00, 250.00, 550, 150)'>
  <path class="hitPath" d='m 150 150 Q 350.00 250.00 550 150'/>
  <path class='path' d='m 150 150 Q 350.00 250.00 550 150' stroke-dasharray="16 16"/>
</g><g class="edge" data-edge="edge_2" onclick='travelPath("edge_2", 550, 150, 550.00, 350.00, 550, 550)'>
  <path class="hitPath" d='m 550 150 Q 550.00 350.00 550 550'/>
  <path class='path' d='m 550 150 Q 550.00 350.00 550 550' stroke-dasharray="16 16"/>
</g>
			  <foreignObject class="codeBoxEdge" data-edge="edge_0" x="220" y="40" width="300px" height="70px"
  onclick='travelPath("edge_0", 150, 150, 350.00, 50.00, 550, 150)'>
  <div
    id="edge_0"
    class="overlayTextarea"
    style="top:0%;left:0%;width:100%;height:100%;overflow-x:auto;"
    name="ForestCodeBox"
    wrap="soft"
    autocomplete="off"
    spellcheck="false"
    readonly
    >Direction</div>
  </foreignObject><foreignObject class="codeBoxEdge" data-edge="edge_1" x="220" y="200" width="280px" height="70px"
  onclick='travelPath("edge_1", 150, 150, 350.00, 250.00, 550, 150)'>
  <div
    id="edge_1"
    class="overlayTextarea"
    style="top:0%;left:0%;width:100%;height:100%;overflow-x:auto;"
    name="ForestCodeBox"
    wrap="soft"
    autocomplete="off"
    spellcheck="false"
    readonly
    >:{ .turn: </div>
  </foreignObject><foreignObject class="codeBoxEdge" data-edge="edge_2" x="400" y="420" width="250px" height="40px"
  onclick='travelPath("edge_2", 550, 150, 550.00, 350.00, 550, 550)'>
  <div
    id="edge_2"
    class="overlayTextarea"
    style="top:0%;left:0%;width:100%;height:100%;overflow-x:auto;"
    name="ForestCodeBox"
    wrap="soft"
    autocomplete="off"
    spellcheck="false"
    readonly
    >; }</div>
  </foreignObject>
              <path id="currentTravelingPath" class="hitPath"/>
              <circle class=""
  cx="150" cy="150"
  r="15"
  fill="red"
/>
<circle class=""
  cx="550" cy="150"
  r="15"
  fill="red"
/>
<circle class="finishNode"
  cx="550" cy="550"
  r="15"
  fill="lightgreen"
/>
              
              <foreignObject
                id="foreignObjectCodeBox" x="0" y="0" width="0px" height="0px"
                style="pointer-events:none">
                <div
                  id="codeBoxOverlayTop"
                  class="overlayTextarea highlighted"
                  style="width:100%;height:100%;overflow-x:auto;opacity:1"
                  name="ForestCodeBox"
                  wrap="soft"
                  autocomplete="off"
                  spellcheck="false"
                  readonly></div>
                </foreignObject>
             <foreignobject
                x="0" y="0" width="100%" height="100%"
                style="pointer-events:none">
                <div class="overlayTextarea" id="output"
style="top:0%;left:55.00%;width:45%;height:40.00%;overflow-x:auto;pointer-events:auto"
name="ForestOutputBox"
data-solution="//Go on the same path again to collect&#10;//the same code multiple times&#10;Direction:{ .turn: Direction; }"
data-original="//Go on the same path again to collect&#10;//the same code multiple times&#10;"
autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" readonly>//Go on the same path again to collect&#10;//the same code multiple times&#10;</div>

              </foreignobject>
              <image
                id="currentNodeMarker"
                href="../../resources/forest/face.png"
                width="80"
                height="80"
              />
            </svg>
            
            <div class="buttonContainer">
              <div class="roundBtn" data-tooltip="Check your work">
                <button id="submitBtn">🎉</button>
                </div>
				<div class="roundBtn" data-tooltip="Undo">
                  <button id="undoBtn">↩</button>
                  </div>
              <div class="roundBtn" data-tooltip="Reset">
                <button id="resetBtn">⟳</button>
                </div>
              </div>
            <div id="hintCharacter" class="panic" hidden>
              <img src="../../assets/panic/_panickPoint.png" class="panicImg" draggable="false">
              <div class="speechBubble"><p></p></div>
              </div>
          </div>
  <div id="screenOverlay"></div>
  <div id="gameMessage" class="messageBox" style="display: none;"></div>
  <div id="levelEndCharacter" class="divFullScreenImage" hidden>
    <img src="../../resources/weDidIt.png" alt="We did it!" draggable="false">
    </div>
  <div id="levelFail" class="divFullScreenImage" hidden>
    <img src="../../resources/walkFallEnd.png" alt="Oof!" draggable="false">
    </div>
</div>
</body>
</html>
